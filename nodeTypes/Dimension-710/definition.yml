fileVersion: 2
id: "710"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Dimension 
    short: DIM
    tagColor: '#1E339A'
    plural: Dimensions

    enableCTESupport: true

    systemColumns:

    - displayName: '{{NODE_NAME}}_KEY'
      transform: "0"
      dataType: NUMBER
      placement: beginning
      attributeName: isSurrogateKey

    - displayName: SYSTEM_VERSION
      transform: "1"
      dataType: NUMBER
      placement: end
      attributeName: isSystemVersion

    - displayName: SYSTEM_CURRENT_FLAG
      transform: "'Y'"
      dataType: VARCHAR
      placement: end
      attributeName: isSystemCurrentFlag

    - displayName: SYSTEM_CREATE_DATE
      transform: CAST(CURRENT_TIMESTAMP AS TIMESTAMP)
      dataType: TIMESTAMP
      placement: end
      attributeName: isSystemCreateDate

    - displayName: SYSTEM_UPDATE_DATE
      transform: CAST(CURRENT_TIMESTAMP AS TIMESTAMP)
      dataType: TIMESTAMP
      placement: end
      attributeName: isSystemUpdateDate

    - displayName: SYSTEM_END_DATE
      transform: CAST('2999-12-31 00:00:00' AS TIMESTAMP)
      dataType: TIMESTAMP
      placement: end
      attributeName: isSystemEndDate

    annotations:
        node:

        - name: truncateBefore
          type: boolean
          description: >-
            Controls whether the target table is truncated before loading with 𝗺𝗲𝗿𝗴𝗲.
            If not mentioned, truncation is skipped.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          default: false

        - name: zeroKey
          type: boolean
          description: >-
            Inserts a default "zero key" record into the target — a placeholder row used to catch unresolved
            foreign key lookups. If not mentioned, the zero record is not inserted.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          default: false
          parameters:
            - name: surrogateKeyValue
              type: string
              description: Value used for the zero record's surrogate key column.
              isRequired: true
              default: "0"
              example: "0"

            - name: stringValue
              type: string
              description: Default value used for the zero record's string/varchar columns.
              isRequired: false
              default: "UNKNOWN"
              example: "UNKNOWN"

            - name: timestampValue
              type: string
              description: Default value used for the zero record's date/time/timestamp columns.
              isRequired: false
              default: "1900-01-01 00:00:00"
              example: "1900-01-01 00:00:00"

            - name: booleanValue
              type: string
              description: Default value used for the zero record's boolean columns.
              isRequired: false
              default: true
              example: true
              options: [true, false]

        - name: disableTests
          type: boolean
          description: >-
            Controls whether configured tests are skipped.
            Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false
          default: false

        - name: tests
          description: >-
            Node-level data quality test.
            Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗿𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
            Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: preSQL
          description: >-
            SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            Repeat the annotation to run multiple statements in the order they appear.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: >-
            SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
                Repeat the annotation to run multiple statements in the order they appear.
                𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: isSurrogateKey
          description: >-
            Marks this column as the node's surrogate key. Required on every table-materialized node.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: 0 AS "{{NODE_NAME}}_KEY" @isSurrogateKey
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isSystemVersion
          description: >-
            Marks this column as the SCD version number, incremented each time a business key gets a new version.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: 1 AS "SYSTEM_VERSION" @isSystemVersion
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isSystemCurrentFlag
          description: >-
            Marks this column as the SCD "is current" flag — 'Y' on the active version of a row, overwritten to 'N' when it's expired.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: 'Y' AS "SYSTEM_CURRENT_FLAG" @isSystemCurrentFlag
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isSystemCreateDate
          description: >-
            Marks this column as the timestamp a row version was first created.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isSystemUpdateDate
          description: >-
            Marks this column as the timestamp a row was last updated.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isSystemEndDate
          description: >-
            Marks this column as the SCD Type 2 expiration timestamp — a far-future sentinel while the row is current, set to the actual expiry time once superseded.
            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻: CAST('2999-12-31 00:00:00' AS TIMESTAMP) AS "SYSTEM_END_DATE" @isSystemEndDate
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isBusinessKey
          description: >-
            Marks a column as part of the business key used to match existing rows during the merge.
            This node picks its update strategy one of two mutually exclusive ways — 𝗰𝗵𝗮𝗻𝗴𝗲-𝘁𝗿𝗮𝗰𝗸𝗶𝗻𝗴 (via 𝗶𝘀𝗖𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴) or 𝗹𝗮𝘀𝘁-𝗺𝗼𝗱𝗶𝗳𝗶𝗲𝗱 (via 𝗶𝘀𝗟𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱). If neither is used on any column, the node defaults to 𝗖𝗵𝗮𝗻𝗴𝗲-𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: true

        - name: isLastModified
          description: >-
            Marks the column used to detect newer source rows for an 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝗻𝘁𝗮𝗹 𝗹𝗼𝗮𝗱 𝗯𝗮𝘀𝗲𝗱 𝗼𝗻 𝗶𝘁𝘀 𝘁𝗶𝗺𝗲𝘀𝘁𝗮𝗺𝗽 — a row is pulled in whenever this column's value is newer than what's already in the target.
            𝗗𝗮𝘁𝗮𝘁𝘆𝗽𝗲: 𝗗𝗔𝗧𝗘/𝗧𝗜𝗠𝗘 𝗼𝗿 𝗮𝗻𝘆 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝗻𝘁𝗶𝗻𝗴 𝗡𝗨𝗠𝗘𝗥𝗜𝗖 𝘁𝘆𝗽𝗲.
            When applied 𝗮𝗹𝗼𝗻𝗴 𝘄𝗶𝘁𝗵 change tracking columns, this last-modified comparison 𝘁𝗮𝗸𝗲𝘀 𝗽𝗿𝗶𝗼𝗿𝗶𝘁𝘆 over the column-by-column SCD1/SCD2 change-tracking comparison.
            𝗖𝗮𝗻 𝗼𝗻𝗹𝘆 𝗯𝗲 𝗮𝗽𝗽𝗹𝗶𝗲𝗱 𝘁𝗼 𝗼𝗻𝗲 𝗰𝗼𝗹𝘂𝗺𝗻.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: scdType
              type: number
              description: |-
                Whether a changed row is updated in place or versioned:
                1 — 𝗼𝘃𝗲𝗿𝘄𝗿𝗶𝘁𝗲𝘀 the row in place.
                2 — 𝗲𝘅𝗽𝗶𝗿𝗲𝘀 the row and 𝗶𝗻𝘀𝗲𝗿𝘁𝘀 𝗮 𝗻𝗲𝘄 𝘃𝗲𝗿𝘀𝗶𝗼𝗻.
              isRequired: false
              default: 1
              options: [1, 2]

        - name: isChangeTracking
          description: |-
            Marks a column to be watched for changes that decide SCD type:
            Marked on any column — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮: a change expires the existing row and inserts a new version.
            Not marked on any column — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭: a change updates the row in place.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝘄𝗵𝗲𝗻 𝗶𝘀𝗟𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱 𝗶𝘀 𝘀𝗲𝘁 — 𝗹𝗮𝘀𝘁-𝗺𝗼𝗱𝗶𝗳𝗶𝗲𝗱 𝗰𝗼𝗺𝗽𝗮𝗿𝗶𝘀𝗼𝗻 𝘁𝗮𝗸𝗲𝘀 𝗽𝗿𝗶𝗼𝗿𝗶𝘁𝘆.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false

        - name: zeroKey
          description: >-
            Adds a custom zero key value (ghost record) to this column, overriding the node-level 𝘇𝗲𝗿𝗼𝗞𝗲𝘆 defaults for it.
            The value is pasted into the SQL verbatim, so quote it to match the column's data type —
            @zeroKey("'<text>'"), @zeroKey("<number>"), @zeroKey(<bool>), or @zeroKey(<timestamp>).
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 𝘇𝗲𝗿𝗼𝗞𝗲𝘆 𝗶𝘀 𝗲𝗻𝗮𝗯𝗹𝗲𝗱 𝗮𝘁 𝘁𝗵𝗲 𝗻𝗼𝗱𝗲 𝗹𝗲𝘃𝗲𝗹.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: value
              type: string
              description: Custom zero key value for this column, pasted into the SQL verbatim.
              isRequired: true
              example: "'<text>'"

        - name: inHash
          description: >-
                Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
                Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
                𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Group hash name shared by every column feeding the same hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Position of this column within its hash group, lowest first.
              example: 1

        - name: not_null
          description: >-
            🚦 Column-level data quality test.
            Fails on rows where the column is 𝗡𝗨𝗟𝗟.
            Presence enables the test — remove the annotation to turn it off.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: uniqueness
          description: >- 
            🚦 Column-level data quality test.
            Fails when a value appears on more than one row.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: empty
          description: >-
            🚦 Column-level data quality test.
            Fails on rows where the column trims to the empty string;
            𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: accepted_values
          description: >-
            🚦 Column-level data quality test.
            Fails on rows whose value is outside the allow list.
            Repeat the annotation once per permitted value.
            Each value is pasted into the SQL verbatim, so quote it to match the column's data
            type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: >-
            🚦 Column-level data quality test.
            Fails on rows whose value is in the deny list.
            Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
            rejected_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "'<string>'"

        - name: min_max
          description: >-
            🚦 Column-level data quality test.
            Fails on rows outside the inclusive range.
            Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: min_value
          description: >-
            🚦 Column-level data quality test.
            Fails on rows below the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"

        - name: max_value
          description: >-
            🚦 Column-level data quality test.
            Fails on rows above the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: freshness
          description: >-
            🚦 Column-level data quality test.
            Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: interval
              description: >-
                How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: >-
            🚦 Column-level data quality test.
            Compares this column against another date/time column on the same node using the
            given operator.
            E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
            A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: operator
              type: string
              description: Comparison operator used to compare this column against the other column.
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
              example: "="

            - name: column
              type: string
              description: Name of the other date/time column on this node to compare against.
              isRequired: true
              example: "<other_column>"
name: Dimension
type: NodeType
