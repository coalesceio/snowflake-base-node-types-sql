fileVersion: 2
id: 4a720337-2713-45a5-b3f2-2d47d7abe3e5
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Dimension 
    short: DIM
    plural: Dimensions
    tagColor: '#1E339A'

    enableCTESupport: true

    annotations:
        node:

        - name: writeMode
          description: |-
            • Controls how data is written to the target table.
            • 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
            • 𝗮𝗽𝗽𝗲𝗻𝗱 inserts the new rows alongside whatever is already there.
            If not specified in the SQL, defaults to 𝗮𝗽𝗽𝗲𝗻𝗱.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: append
              example: truncateInsert
              options:
                - truncateInsert
                - append

        - name: mergeStrategy
          description: |-
            • Chooses how this dimension decides a row has changed, and therefore which column annotations it requires. 
            • If not specified, defaults to 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 - 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭
            • Ignored on views.
          isRequired: false
          parameters:
            - name: strategy
              type: string
              description: |-
                ◆ 𝘂𝗽𝘀𝗲𝗿𝘁
                  • No change detection at all — a matched row is always updated, an unmatched row is inserted.
                  • Doesn't assert any SCD type of its own — if the upstream SELECT/CTE already implements SCD1/SCD2 logic, this strategy just merges that result through as-is, without re-deriving or re-checking it.
                  • Requires no 𝗶𝘀𝗖𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴/𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 columns — the run fails if either is present, since they'd silently be ignored.

              ◆ 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴
                  • Compares columns marked 𝗶𝘀𝗖𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 (or, if none are marked, every plain attribute column) to detect a change.
                  • 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 if any column is marked 𝗶𝘀𝗖𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴, otherwise 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭.
                  • Requires no 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 column — the run fails if one is present.

              ◆ 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱
                  • Compares a single 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 timestamp column against the target's stored value.
                  • Requires exactly one column marked 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 — the run fails if none is present (𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴 itself still rejects more than one).
                  • 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 𝗼𝗿 𝟮 comes from that column's own 𝘀𝗰𝗱𝗧𝘆𝗽𝗲 parameter.
                isRequired: true
                default: changeTracking
                options:
                  - upsert
                  - changeTracking
                  - lastModified

        - name: zeroKey
          description: |-
            • Inserts a default "zero key" record into the target — a placeholder row used to catch unresolved foreign key lookups.
            • Ignored on views.
          isRequired: false
          default: false
          parameters:
            - name: surrogateKeyValue
              type: string
              description: Value used for the zero record's surrogate key column.
              isRequired: true
              default: "0"
              example: "0"

            - name: stringValue
              type: string
              description: Default value used for the zero record's string/varchar columns.
              isRequired: false
              default: "UNKNOWN"
              example: "UNKNOWN"

            - name: timestampValue
              type: string
              description: Default value used for the zero record's date/time/timestamp columns.
              isRequired: false
              default: "1900-01-01 00:00:00"
              example: "1900-01-01 00:00:00"

            - name: booleanValue
              type: string
              description: Default value used for the zero record's boolean columns.
              isRequired: false
              default: true
              example: true
              options: [true, false]

        - name: disableTests
          type: boolean
          description: |-
            • Controls whether configured tests are skipped.
            • Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false
          default: false

        - name: tests
          description: |-
            • 🚦Node-level data quality test.
            • Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: preSQL
          description: |-
            • SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            • Repeat the annotation to run multiple statements in the order they appear.
            • Ignored on views.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: |-
            • SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
            • Repeat the annotation to run multiple statements in the order they appear.
            • Ignored on views.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: isBusinessKey
          description: |-
            • Marks a column as part of the business key used to match existing rows during the merge.
            • Ignored on views.
          isRequired: true

        - name: lastModifiedTracking
          description: |-
            • Marks the column used to detect newer source rows for an 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝗻𝘁𝗮𝗹 𝗹𝗼𝗮𝗱.
            • 𝗗𝗮𝘁𝗮𝘁𝘆𝗽𝗲 - DATE/TIME or any incrementing NUMERIC type.
            • Can only be applied to one column.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: scdType
              type: number
              description: |-
                • Whether a changed row is updated in place or versioned.
                • 1 — 𝗼𝘃𝗲𝗿𝘄𝗿𝗶𝘁𝗲𝘀 the row in place.
                • 2 — 𝗲𝘅𝗽𝗶𝗿𝗲𝘀 the row and inserts a new version.
              isRequired: false
              default: 1
              options: [1, 2]

        - name: isChangeTracking
          description: |-
            • Marks a column to be watched for changes that decide SCD type:
            • 𝗠𝗮𝗿𝗸𝗲𝗱 — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 - a change expires the existing row and inserts a new version.
            • Not 𝗠𝗮𝗿𝗸𝗲𝗱 — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 - a change updates the row in place.
            • Ignored on views.
          isRequired: false

        - name: zeroKey
          description: |-
            • Adds a custom zero key value (ghost record) to this column, overriding the node-level 𝘇𝗲𝗿𝗼𝗞𝗲𝘆 defaults for it.
            • 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 𝘇𝗲𝗿𝗼𝗞𝗲𝘆 𝗶𝘀 𝗲𝗻𝗮𝗯𝗹𝗲𝗱 𝗮𝘁 𝘁𝗵𝗲 𝗻𝗼𝗱𝗲 𝗹𝗲𝘃𝗲𝗹.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: value
              type: string
              description: Custom zero key value for this column, pasted into the SQL verbatim.
              isRequired: true
              example: "<value>"

        - name: inHash
          description: |-
                • Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
                • Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
                • 𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Group hash name shared by every column feeding the same hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Position of this column within its hash group, lowest first.
              example: 1

        - name: isSurrogateKey
          description: |-
            • Marks this column as the node's surrogate key.
            • 𝗢𝗽𝘁𝗶𝗼𝗻𝗮𝗹 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 — the merge logic joins and detects changes entirely off the business key (@isBusinessKey).
            • 𝗥𝗲𝗰𝗼𝗺𝗺𝗲𝗻𝗱𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 — a stable surrogate key per version is the standard way to support versioned business key. Not enforced — the merge itself doesn't require it.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗼𝗻𝗹𝘆 𝘄𝗵𝗲𝗻 the node-level @zeroKey is set, since the zero/ghost record is matched against the target by surrogate key value.
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            0 AS "{{NODE_NAME}}_KEY" @isSurrogateKey

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemVersion
          description: |-
            • Marks this column as the SCD version number, incremented each time a business key gets a new version.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 — shows which version of a row this is. Each time a business key's row changes, the expired row is kept and a new row is inserted with this value incremented by 1.
            • 𝗢𝗽𝘁𝗶𝗼𝗻𝗮𝗹 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 — new-vs-existing is detected off the business key alone, so this column can be dropped entirely; if kept, it is always written as 1 and never incremented.
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            1 AS "SYSTEM_VERSION" @isSystemVersion

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemCurrentFlag
          description: |-
            • Marks this column as the SCD "is current" flag — 'Y' on the active version of a row, overwritten to 'N' when it's expired.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 — used to filter the target down to each business key's one current row before comparing it against the incoming source row.
            • 𝗢𝗽𝘁𝗶𝗼𝗻𝗮𝗹 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 —  safe to omit; if kept, it is always written as 'Y'.
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            'Y' AS "SYSTEM_CURRENT_FLAG" @isSystemCurrentFlag

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemCreateDate
          description: |-
            • Marks this column as the timestamp a row (or, under SCD Type 2, a specific row version) was first created.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 @mergeStrategy 𝗶𝘀 𝘂𝗽𝘀𝗲𝗿𝘁
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemUpdateDate
          description: |-
            • Marks this column as the timestamp a row was last updated.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 — read back from the target and refreshed to the current timestamp whenever a row is inserted as a new version or its prior current version is expired.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 — recomputed to the current timestamp on every inserted or changed row, so every row change carries an audit trail of when it was last updated.
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemEndDate
          description: |-
            • Marks this column as the SCD Type 2 expiration timestamp — a far-future sentinel while the row is current, set to the actual expiry time once superseded.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 — this is what makes a version's active window queryable; omitting it leaves expired versions with no expiry marker.
            • 𝗢𝗽𝘁𝗶𝗼𝗻𝗮𝗹 𝗳𝗼𝗿 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 — (no versioning, so nothing ever expires) — safe to omit entirely.
            • Ignored on views.

            𝗘𝘅𝗽𝗲𝗰𝘁𝗲𝗱 𝗲𝘅𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻:
            CAST('2999-12-31 00:00:00' AS TIMESTAMP) AS "SYSTEM_END_DATE" @isSystemEndDate

            𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗰𝗿𝗲𝗮𝘁𝗶𝗼𝗻 𝗼𝗻𝗹𝘆 — manual creation adds this column automatically.
          isRequired: false

        - name: not_null
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column is 𝗡𝗨𝗟𝗟.
            Presence enables the test — remove the annotation to turn it off.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: uniqueness
          description: |- 
            🚦 Column-level data quality test.
            Fails when a value appears on more than one row.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: empty
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column trims to the empty string;
            𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: accepted_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is outside the allow list.
            Repeat the annotation once per permitted value.
            Each value is pasted into the SQL verbatim, so quote it to match the column's data
            type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is in the deny list.
            Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
            rejected_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "'<string>'"

        - name: min_max
          description: |-
            🚦 Column-level data quality test.
            Fails on rows outside the inclusive range.
            Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: min_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows below the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"

        - name: max_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows above the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: freshness
          description: |-
            🚦 Column-level data quality test.
            Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: interval
              description: |-
                How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: |-
            🚦 Column-level data quality test.
            Compares this column against another date/time column on the same node using the
            given operator.
            E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
            A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: operator
              type: string
              description: Comparison operator used to compare this column against the other column.
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
              example: "="

            - name: column
              type: string
              description: Name of the other date/time column on this node to compare against.
              isRequired: true
              example: "<other_column>"

    sqlInitializationTemplate: |
          {%- macro ref_raw(location_name, node_name) -%}
            {% raw %}{{ ref('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
          {%- endmacro -%}
          {%- set ns = namespace(lines=[]) -%}
          {%- set ns.lines = ns.lines + ['"0" AS "{{NODE_NAME}}_KEY" @isSurrogateKey'] -%}
          {%- for dep in sources[0].dependencies -%}
            {%- for col in dep.columns -%}
              {%- set ns.lines = ns.lines + ['"' ~ col.name ~ '" AS "' ~ col.name ~ '"'] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set ns.lines = ns.lines + ['1 AS "SYSTEM_VERSION" @isSystemVersion'] -%}
          {%- set ns.lines = ns.lines + ["'Y' AS \"SYSTEM_CURRENT_FLAG\" @isSystemCurrentFlag"] -%}
          {%- set ns.lines = ns.lines + ['CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate'] -%}
          {%- set ns.lines = ns.lines + ['CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate'] -%}
          {%- set ns.lines = ns.lines + ["CAST('2999-12-31 00:00:00' AS TIMESTAMP) AS \"SYSTEM_END_DATE\" @isSystemEndDate"] -%}
          SELECT
          {{ ns.lines | join(',\n') }}
          {% for dep in sources[0].dependencies -%}
            {%- if loop.first -%}
              FROM {{ ref_raw(dep.node.location.name, dep.node.name) }} "{{ dep.node.name }}"
            {%- else %}
              INNER JOIN {{ ref_raw(dep.node.location.name, dep.node.name) }} "{{ dep.node.name }}"
              ON "{{ sources[0].dependencies[0].node.name }}".JOIN_COLUMN = "{{ dep.node.name }}".JOIN_COLUMN
            {%- endif -%}
          {%- endfor %}
name: Dimension
type: NodeType
