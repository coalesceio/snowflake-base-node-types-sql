metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SQL Work
    short: WRK
    plural: Works
    tagColor: '#2EB67D'

    enableCTESupport: true

    annotations:
        node:

        - name: materializationType
          description: Materialization selector
          isRequired: false
          parameters:
            - name: type
              type: string
              description: Object type to create
              isRequired: true
              default: table
              options:
              - table
              - view

        - name: truncateBefore
          type: boolean
          description: 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false      
          default: true

        - name: testsEnabled
          type: boolean
          description: Controls whether configured tests are executed.
          isRequired: false
          default: true

        - name: tests
          description: The test fails if the query returns any records. Applicable only when 𝘁𝗲𝘀𝘁𝘀𝗘𝗻𝗮𝗯𝗹𝗲𝗱 is enabled.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: Before
              options:
                - Before
                - After

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

        - name: preSQL
          description: SQL statement to execute before data load operation. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: SQL statement to execute after data load operation. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:
        - name: description
          description: Adds column description.
          isRequired: false
          parameters:
          - name: descText
            isRequired: true
            type: string
            description: Column description

        - name: notNull
          type: boolean
          description: Enforce 𝗡𝗢𝗧 𝗡𝗨𝗟𝗟 on the target column. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          default: true

        - name: defaultValue
          description: 𝗗𝗘𝗙𝗔𝗨𝗟𝗧 applied when the source column value is 𝗡𝗨𝗟𝗟. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: value
              description: Specify a default value appropriate for the column data type. Compatible data types can have values without quotes.
              type: string
              isRequired: true

        - name: inHash
          description: Marks columns for hash key generation. Use the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡() macro to generate the hash column from the marked columns. 𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Common name assigned to the generated hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Order of columns used to calculate the hash.
              example: 1

        - name: tests
          description: Column level tests for data quality requirements. Either or both tests can be specified based on validation requirements. Order of specification does not matter. Applicable only when @𝘁𝗲𝘀𝘁𝘀𝗘𝗻𝗮𝗯𝗹𝗲𝗱 is applied.
          allowsMultiple: true
          isRequired: false
          parameters:
            - name: type
              type: string
              description: |
                Column level data quality requirement type.
                ➤ 𝐮𝐧𝐢𝐪𝐮𝐞: Checks to ensure all values are 𝗨𝗡𝗜𝗤𝗨𝗘.
                ➤ 𝐧𝐮𝐥𝐥: Ensures the column contains no 𝗡𝗨𝗟𝗟 values. |
              isRequired: true
              parameters:
              options:
                - 'unique'
                - 'null'
name: SQL Work
