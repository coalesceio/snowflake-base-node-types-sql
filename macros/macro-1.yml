fileVersion: 1
id: "1"
macroString: |-
  {# ========================================================================
  Purpose          : Executes data quality tests associated with the node
                      and its columns, based on the configured run order.
                      Supports running tests either before or after data
                      insertion, and respects the test continuation
                      behavior on failure.
  Input Parameters : runOrder (String)
                      - Determines when the tests should be executed.
                          Expected values: 'Before' or 'After'
  Returns          : Rendered SQL statements for executing the applicable
                      node-level and column-level data quality tests.
                      No output is generated if tests are disabled.
  ========================================================================= #}
  {%- macro run_tests(runOrder) -%}

      {%- if config.columnRunOrder is defined
          and config.columnRunOrder.parameters is defined
          and config.columnRunOrder.parameters | length > 0 -%}
          {%- set configRunOrder = config.columnRunOrder.parameters[0] -%}
      {%- endif -%}

      {%- if get_boolean_config("testsEnabled") == "true" %}
          {%- if runOrder == 'After' -%}
              {%- for column in columns -%}
                  {%- if column.tests is defined -%}
                      {%- for test in column.tests | default([]) -%}
                          {%- if test is mapping and test.parameters is defined -%}
                              {%- if test.parameters[0] | trim | lower == "null" -%}
                                  {%- set templateString = "SELECT 1 FROM " +  ref(node.location.name, node.name)  + ' WHERE "' + column.name + '" IS NULL ' -%}                      
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[1] | default(true) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "unique" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + ' GROUP BY "' + column.name +  '" HAVING COUNT(*) > 1' -%}                      
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[1] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "empty" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND TRIM(CAST( " + column.name + " AS STRING)) = ''" -%}                      
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[1] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "acceptedvalues" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND " + column.name + " NOT IN (" -%}
                                  {%- set accepted = test.parameters[1] if test.parameters[1] is sequence and test.parameters[1] is not mapping else [] %}
                                  {%- set templateString = templateString + test.parameters[1] + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[2] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "rejectedvalues" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND " + column.name + " IN (" -%}
                                  {%- set accepted = test.parameters[1] if test.parameters[1] is sequence and test.parameters[1] is not mapping else [] %}
                                  {%- set templateString = templateString + test.parameters[1] + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[2] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "valuerange" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND (" + column.name + " < " + test.parameters[1] | string + " OR " + column.name + " > " + test.parameters[2] | string + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[3] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "minvalue" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND " + column.name + " < " + test.parameters[1] | string -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[2] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "maxvalue" -%}
                                  {%- set templateString = "SELECT 1 FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND " + column.name + " > " + test.parameters[1] | string -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[2] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "freshness" -%}
                                  {%- set templateString = "SELECT MAX(" + column.name + ") AS LATEST_VALUE FROM " + ref(node.location.name, node.name) + " HAVING MAX(" + column.name + ") IS NULL OR MAX(" + column.name + ") < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL " + test.parameters[1] | string + " " + (test.parameters[2] | default("DAY", true)) + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[3] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "relativetime" -%}
                                  {%- set templateString = "SELECT " + column.name + ", " + test.parameters[2] + " FROM " + ref(node.location.name, node.name) + " WHERE " + column.name + " IS NOT NULL AND " + test.parameters[2] + " IS NOT NULL AND NOT (" + column.name + " " + test.parameters[1] + " " + test.parameters[2] + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + test.parameters[0], test.parameters[3] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "rules" -%}
                                  {%- set templateString = "SELECT * FROM " + ref(node.location.name, node.name) + " WHERE NOT (" + test.parameters[1] + ")" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + (test.parameters[2] | default(test.parameters[0], true)), test.parameters[3] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "query" -%}
                                  {%- set templateString = test.parameters[1] -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + (test.parameters[2] | default(test.parameters[0], true)), test.parameters[3] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                              {%- if test.parameters[0] | trim | lower == "relationship" -%}
                                  {%- set templateString = "SELECT `CHILD`." + column.name + " FROM " + ref(node.location.name, node.name) + " `CHILD` LEFT JOIN " + ref_no_link(test.parameters[1], test.parameters[2]) + " `PARENT` ON `CHILD`." + column.name + " = `PARENT`." + test.parameters[3] + " WHERE `CHILD`." + column.name + " IS NOT NULL AND `PARENT`." + test.parameters[3] + " IS NULL" -%}
                                  {{ test_stage("Column Test: " + column.name + " - " + (test.parameters[4] | default(test.parameters[0], true)), test.parameters[5] | default(true)) }}
                                  {{ templateString }}
                              {%- endif -%}
                          {%- endif -%}
                      {%- endfor -%}
                  {%- endif -%}
              {%- endfor -%}
          {%- endif -%}

          {%- set ns = namespace(cnt=0) -%}
          {%- for test in config.tests | default([]) -%}
              {%- if test is mapping and test.parameters is defined -%}
                  {%- if test.parameters[2] | default("Before") == runOrder -%}
                      {%- set ns.cnt = ns.cnt + 1 -%}
                      {{ test_stage(
                          ('Pre Load Test ' if runOrder == 'Before' else 'Post Load Test ') ~ ns.cnt,
                          test.parameters[1] | default(true)
                      ) }}
                      {{ test.parameters[0] }}
                  {%- endif -%}
              {%- endif -%}
          {%- endfor -%}

      {%- endif -%}
  {%- endmacro -%}

  {# ========================================================================
  Purpose:
      Returns the SQL expression to be used for a column transformation.

  Input:
      col
          - transform: Column transform expression.
          - sourceColumns[0].node.name: Source table name.
          - sourceColumns[0].column.name: Source column name.

  Logic:
      1. If transform is not empty and matches the source column name
          (ignoring double quotes), return a fully qualified source
          column reference:
              "SOURCE_TABLE"."SOURCE_COLUMN"

      2. If transform is not empty and does not match the source column
          name, return the transform expression as-is.

      3. If transform is empty, return NULL.

  Examples:
      transform = '"N_NAME"'      -> "NATION_TEST"."N_NAME"
      transform = 'N_NAME'        -> "NATION_TEST"."N_NAME"
      transform = 'UPPER(N_NAME)' -> UPPER(N_NAME)
      transform = ''              -> NULL
  ========================================================================#}
  {%- macro get_source_transform_v2(col) -%}
      {%- set transform = col.transform | trim -%}
      {%- if transform != '' -%}
          {%- if col.sourceColumns
                  and col.sourceColumns[0].node
                  and transform | replace('"', '')
                      == col.sourceColumns[0].column.name -%}

              "{{ col.sourceColumns[0].node.name }}"."{{ col.sourceColumns[0].column.name }}"
          {%- else -%}
              {{ transform }}
          {%- endif -%}
      {%- else -%}
          NULL
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  Description:
  Generates a deterministic hash value by combining and hashing all column values associated with the given `hash_name` using the `@inHash` annotation.

  Input: `hash_name` (string) - The hash group identifier used in `@inHash("<hash_name>")` to group columns for hashing.

  Output: - Returns a SQL expression of type `STRING`:
          - A SHA1 hash of concatenated column values  
          - Returns `NULL` if no columns are mapped to the given hash group
  ====================================================================================================#}
  {%- macro get_hash(hash_name, algo='SHA1', delimiter='||', datatype='STRING') -%}

      {%- set cols = namespace(items=[]) -%}
      {%- set algo_upper = algo | upper -%}

      {# Collect columns participating in this hash #}
      {%- for col in sources[0].columns -%}

          {%- if col.inHash is defined -%}
              {%- for p in col.inHash -%}
                  {%- set parts = p.parameters[0] %}
                  {%- set position = p.parameters[1] | int -%}
                  {%- set hash = p.parameters[0] -%}

                  {%- if hash == hash_name -%}
                      {%- set cols.items = cols.items + [{
                          "position": position,
                          "column": get_source_transform_v2(col)
                      }] -%}
                  {%- endif -%}
              {%- endfor -%}
          {%- endif -%}
      {%- endfor -%}

      {%- if cols.items | length == 0 -%}
          NULL
      {%- else -%}
          {%- set sorted_cols = cols.items | sort(attribute='position') -%}
          {# Define algo wrappers #}
          {%- set algo_start = algo_upper + '(' -%}
          {%- set algo_end = ')' -%}

          {%- if algo_upper == 'SHA256' -%}
              {%- set algo_start = 'SHA2(' -%}
              {%- set algo_end = ', 256)' -%}
          {%- endif -%}

          CAST(
              {{ algo_start }}
                  {%- for c in sorted_cols -%}
                      NVL(CAST({{ c.column }} AS VARCHAR), 'null')
                      {%- if not loop.last %}
                          || {%- if delimiter != '' %} '{{ delimiter }}' || {% endif -%}
                      {%- endif -%}
                  {%- endfor -%}
              {{ algo_end }}
          AS {{ datatype }})
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
    get_boolean_config(flag)

    Description:
      Extracts the boolean value of a configuration flag, supporting both
      annotation formats:
        - @flag
        - @flag(true) / @flag(false)

    Input:
      flag: Name of the boolean configuration flag, e.g. "truncateBefore",
            "testsEnabled", or "clusterDefined".

    Examples:
      @truncateBefore
        -> config["truncateBefore"] = true
        -> Output: true

      @truncateBefore(true)
        -> config["truncateBefore"] = { parameters: [true] }
        -> Output: true

      @truncateBefore(false)
        -> config["truncateBefore"] = { parameters: [false] }
        -> Output: false

      No annotation
        -> config["truncateBefore"] is not defined
        -> Output: empty

    Usage:
      {% if get_boolean_config("truncateBefore") | trim | lower == "true" %}
        ...
      {% endif %}
  ====================================================================================================#}
  {%- macro get_boolean_config(flag) -%}
      {%- if config[flag] is defined -%}
          {%- if config[flag] is boolean -%}
              {{- config[flag] | trim | lower -}}
          {%- elif config[flag].parameters is defined and config[flag].parameters|length > 0 -%}
              {{- config[flag].parameters[0] | trim | lower -}}
          {%- endif -%}
      {%- endif -%}
  {%- endmacro -%}
name: macro
type: Macro
