fileVersion: 1
id: "1"
macroString: |-
  {#====================================================================================================
    Description:
        Returns a zero-key value for a given column based on:
        1. Column-level zeroKey (highest priority)
        2. Config-level zeroKey (matched using column dataType)
        3. If no match is found → returns NULL

        The macro ONLY resolves and formats the zero-key value.
        It does not handle system columns or any business logic.

    Inputs:
        col (object)

    Output:
        Returns a SQL-compatible literal based on resolved zeroKey:
            - NUMBER    → 0
            - BOOLEAN   → TRUE / FALSE
            - STRING    → 'DEFAULT'
            - TIME      → TO_TIMESTAMP('1999-12-31')
            - No match  → NULL
    ====================================================================================================#}
    {%- macro resolve_zero_key(col) -%}

        {%- set ns = namespace(zk_type=none, zk_value=none) -%}

        {# -------------------------------
        STEP 1: Column-level zeroKey
        -------------------------------- #}
        {%- if col.zeroKey is defined 
            and col.zeroKey.parameters is defined 
            and col.zeroKey.parameters | trim | length > 0 -%}

            {%- set ns.zk_value = col.zeroKey.parameters[0] -%}

        {# -------------------------------
        STEP 2: Config-level zeroKey (match datatype)
        -------------------------------- #}
        {%- else -%}
            {%- set zkParams = config.zeroKey.parameters if (config.zeroKey is defined and config.zeroKey.parameters is defined) else [] -%}
            {%- if col.dataType | upper == 'VARIANT' -%}
                {%- set ns.zk_type = 'variant' -%}
                {%- set ns.zk_value = none -%}
            {%- elif col.dataType[:3] | upper in ('VAR', 'CHA', 'STR') -%}
                {%- set ns.zk_type = 'string' -%}
                {%- set ns.zk_value = zkParams[1] if zkParams | length > 1 else 'UNKNOWN' -%}
            {%- elif col.dataType[:3] | upper in ('NUM',' INT', 'DEC', 'FLO') -%}
                {%- set ns.zk_type = 'numeric' -%}
                {%- set ns.zk_value = zkParams[0] if zkParams | length > 1 else 0 -%}
            {%- elif col.dataType | upper == 'BOOLEAN' -%}
                {%- set ns.zk_type = 'boolean' -%}
                {%- set ns.zk_value = zkParams[3] if zkParams | length > 3 else true -%}
            {%- elif col.dataType[:4] | upper in ('DATE', 'TIME', 'TIMESTAMP') -%}
                {%- set ns.zk_type = 'datetime' -%}
                {%- set ns.zk_value = zkParams[2] if zkParams | length > 2 else '1900-01-01 00:00:00' -%}
            {%- endif -%}
        {%- endif -%}

        {# -------------------------------
        STEP 3: Return formatted value
        -------------------------------- #}
        {%- if ns.zk_type == 'numeric' -%}
            {{ ns.zk_value }}
        {%- elif ns.zk_type == 'variant' -%}
            PARSE_JSON('null')
        {%- elif ns.zk_value is not none -%}
            {%- if ns.zk_type == 'boolean' -%}
                {{ ns.zk_value | upper }}

            {%- elif ns.zk_type == 'datetime' -%}
                TO_TIMESTAMP('{{ ns.zk_value }}')

            {%- elif ns.zk_type == 'string' -%}
                '{{ ns.zk_value }}'

            {%- else -%}
                '{{ ns.zk_value }}'
            {%- endif -%}

        {%- else -%}
            NULL
        {%- endif -%}

    {%- endmacro -%}

    {# ========================================================================
    Purpose:
        Returns the SQL expression to be used for a column transformation.

    Input:
        col
            - transform: Column transform expression.
            - sourceColumns[0].node.name: Source table name.
            - sourceColumns[0].column.name: Source column name.

    Logic:
        1. If transform is not empty and matches the source column name
        (ignoring double quotes), return a fully qualified source
        column reference:
            "SOURCE_TABLE"."SOURCE_COLUMN"

        2. If transform is not empty and does not match the source column
        name, return the transform expression as-is.

        3. If transform is empty, return NULL.

    Examples:
        transform = '"N_NAME"'      -> "NATION_TEST"."N_NAME"
        transform = 'N_NAME'        -> "NATION_TEST"."N_NAME"
        transform = 'UPPER(N_NAME)' -> UPPER(N_NAME)
        transform = ''              -> NULL
    ========================================================================#}
    {%- macro get_source_transform_v2(col) -%}
        {%- set transform = col.transform | trim -%}
        {%- if transform != '' -%}
            {%- if col.sourceColumns
                    and col.sourceColumns[0].node
                    and transform | replace('"', '')
                        == col.sourceColumns[0].column.name -%}

                "{{ col.sourceColumns[0].node.name }}"."{{ col.sourceColumns[0].column.name }}"
            {%- else -%}
                {{ transform }}
            {%- endif -%}
        {%- else -%}
            NULL
        {%- endif -%}
    {%- endmacro -%}

    {# ====================================================================================================
    Description:
    Generates a datatype-aware equality comparison between a source and target expression.
    Designed for use in WHERE / JOIN conditions where different Snowflake datatypes
    require different comparison logic.

    Inputs:
    - src_expr (string):
        Source column or expression (e.g., SRC."COL1")

    - tgt_expr (string):
        Target column or expression (e.g., "DIM"."COL1")

    - data_type (string):
        Datatype of the column (e.g., VARCHAR, NUMBER, GEOGRAPHY, GEOMETRY)

    Output:
    - Returns a SQL boolean condition that evaluates to TRUE when source and target values are equal
    ====================================================================================================#}
    {%- macro safe_equals(src_expr, tgt_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt -%}
            (
                ST_DISTANCE(
                    COALESCE({{ src_expr }}, TO_GEOGRAPHY('POINT(0 0)')),
                    COALESCE({{ tgt_expr }}, TO_GEOGRAPHY('POINT(0 0)'))
                ) = 0
            )
        {%- elif 'GEOMETRY' in dt -%}
            (
                ST_DISTANCE(
                    COALESCE({{ src_expr }}, TO_GEOMETRY('POINT(0 0)')),
                    COALESCE({{ tgt_expr }}, TO_GEOMETRY('POINT(0 0)'))
                ) = 0
            )
        {%- else -%}
            {{ src_expr }} = {{ tgt_expr }}
        {%- endif -%}
    {%- endmacro -%}

    {#====================================================================================================
    Description:
    Generates a datatype-aware comparison to detect differences between a source and
    target expression. Typically used in MERGE statements or change tracking logic
    to identify when a column value has changed.

    Inputs:
    - src_expr (string):
        Source column or expression (e.g., SRC."COL1")

    - tgt_expr (string):
        Target column or expression (e.g., "DIM"."COL1")

    - data_type (string):
        Datatype of the column (e.g., VARCHAR, NUMBER, GEOGRAPHY, GEOMETRY)

    Output:
    - Returns a SQL boolean condition that evaluates to TRUE when source and target values are different
    ====================================================================================================#}
    {%- macro safe_compare(src_expr, tgt_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt -%}
            (
                ST_DISTANCE(
                    COALESCE({{ src_expr }}, TO_GEOGRAPHY('POINT(0 0)')),
                    COALESCE({{ tgt_expr }}, TO_GEOGRAPHY('POINT(0 0)'))
                ) > 0
            )
        {%- elif 'GEOMETRY' in dt -%}
            (
                ST_DISTANCE(
                    COALESCE({{ src_expr }}, TO_GEOMETRY('POINT(0 0)')),
                    COALESCE({{ tgt_expr }}, TO_GEOMETRY('POINT(0 0)'))
                ) > 0
            )
        {%- else -%}
            {{ src_expr }} IS DISTINCT FROM {{ tgt_expr }}
        {%- endif -%}

    {%- endmacro -%}


    {# ========================================================================
    Description:
    Parses a SQL join clause string and splits it into two logical parts:
    1. FROM/JOIN portion
    2. Remaining clause (WHERE / GROUP BY / QUALIFY / ORDER BY)

    This is useful when dynamically injecting additional conditions into an
    existing query without breaking its structure.

    Inputs:
    - joinclause (string):
        Full SQL clause containing JOIN + optional filters and clauses.
        May include comments (both block /* */ and line --).

    - ret_clause (string):
        Specifies which part to return:
        - 'from' → returns only the FROM/JOIN portion
        - anything else → returns the remaining clause

    Output:
    - Cleaned and trimmed SQL string based on requested clause
    ========================================================================#}
    {%- macro get_clause( joinclause , ret_clause ) -%}

        {#  STEP 1: Remove Block Comments /* ... */ #}
        {#  We split by the start of the comment and only keep the part after the end of the comment #}
        {%- set ns_block = namespace(text="") -%}
        {%- set block_parts = joinclause.split('/*') -%}
        {%- set ns_block.text = block_parts[0] -%} {# The text before the very first /* #}
        
        {%- for part in block_parts[1:] -%}
            {%- if '*/' in part -%}
                {# Split by the first occurrence of */ and take everything after it #}
                {%- set after_comment = part.split('*/', 1)[1] -%}
                {%- set ns_block.text = ns_block.text ~ ' ' ~ after_comment  -%}
            {%- endif -%}
        {%- endfor -%}

        {# STEP 2: Remove Line Comments #}
        {%- set ns_line = namespace(clean_lines=[]) -%}
        {%- for line in ns_block.text.split('\n') -%}
            {%- set active_part = line.split('--')[0] -%}
            {%- set ns_line.clean_lines = ns_line.clean_lines + [active_part] -%}
        {%- endfor  -%}
        
        {# Rejoin everything and normalize whitespace for searching #}
        {%- set cleaned_join_clause = ns_line.clean_lines | join(' ')  -%}
        {%- set search_string = ' ' ~ cleaned_join_clause.lower().replace('\t', ' ').replace('\r', ' ') ~ ' '  -%}

        {# STEP 3: Identify Keyword Split Point (Priority: WHERE > GROUP > QUALIFY > ORDER) #}
        {%- set found_keyword = '' -%}
        {%- set split_index = -1 -%}

        {%- if ' where ' in search_string -%}
            {%- set found_keyword = 'where'  -%}
            {%- set split_index = search_string.find(' where ') -%}
        {%- elif ' group by ' in search_string -%}
            {%- set found_keyword = 'group by' -%}
            {%- set split_index = search_string.find(' group by ') -%}
        {%- elif ' qualify ' in search_string -%}
            {%- set found_keyword = 'qualify' -%}
            {%- set split_index = search_string.find(' qualify ') -%}
        {%- elif ' order by ' in search_string -%}
            {%- set found_keyword = 'order by' -%}
            {%- set split_index = search_string.find(' order by ') -%}
        {%- endif -%}

        {# STEP 4: Perform the Split #}
        {%- if split_index >= 0 -%}
            {# split_index maps directly to cleaned_join_clause because we replaced chars 1-to-1 #}
            {%- set from_part = cleaned_join_clause[:split_index] -%}
            
            {# offset = keyword length + 1 space #}
            {%- set offset = found_keyword|length + 1 -%}
            {%- set remainder = cleaned_join_clause[split_index + offset:] -%}

            {%- if found_keyword == 'where' -%}
                {%- set add_part = 'AND ' ~ remainder -%}
            {%- else -%}
                {%- set add_part = found_keyword ~ ' ' ~ remainder -%}
            {%- endif -%}
        {%- else -%}
            {%- set from_part = cleaned_join_clause -%}
            {%- set add_part = '' -%}
        {%- endif -%}

        {# STEP 5: Return Result #}
        {%- if ret_clause == 'from' -%}
            {{ from_part | trim }}
        {%- else -%}
            {{ add_part | trim }}
        {%- endif -%}

    {%- endmacro -%}

    {# ========================================================================
    Purpose          : Executes data quality tests associated with the node
                        and its columns, based on the configured run order.
                        Supports running tests either before or after data
                        insertion, and respects the test continuation
                        behavior on failure.
    Input Parameters : runOrder (String)
                        - Determines when the tests should be executed.
                            Expected values: 'Before' or 'After'
    Returns          : Rendered SQL statements for executing the applicable
                        node-level and column-level data quality tests.
                        No output is generated if tests are disabled.
    ========================================================================= #}
    {%- macro run_tests(runOrder) -%}

        {%- set columnContinueOnFailure = true -%}

        {%- if get_boolean_config("disableTests") != "true" -%}
            {%- if runOrder == "After" -%}
                {%- for col in columns -%}
                    {%- set colName = '"' + col.name + '"' -%}
                    {%- set accepted = col.accepted_values if (col.accepted_values is sequence and col.accepted_values is not mapping) else [] -%}
                    {%- set rejected = col.rejected_values if (col.rejected_values is sequence and col.rejected_values is not mapping) else [] -%}
                    {%- set target = ref(node.location.name, node.name) -%}
                    {%- if col.not_null is defined -%}
                        {{ test_stage(col.name + ': not_null', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NULL
                    {%- endif -%}
                    {%- if col.uniqueness is defined -%}
                        {{ test_stage(col.name + ': uniqueness', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        GROUP BY {{ colName }}
                        HAVING COUNT(*) > 1
                    {%- endif -%}
                    {%- if col.empty is defined -%}
                        {{ test_stage(col.name + ': empty', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND TRIM({{ colName }}) = ''
                    {%- endif -%}
                    {%- if accepted | length > 0 -%}
                        {{ test_stage(col.name + ': accepted_values', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL
                        AND {{ colName }} NOT IN ({%- for v in accepted -%} {{ v.parameters[0] }} {%- if not loop.last -%}, {%- endif -%}{%- endfor -%})
                    {%- endif -%}
                    {%- if rejected | length > 0 -%}
                        {{ test_stage(col.name + ': rejected_values', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IN ({%- for v in rejected -%} {{ v.parameters[0] }} {%- if not loop.last -%}, {%- endif -%}{%- endfor -%})
                    {%- endif -%}
                    {%- if col.min_max is defined and col.min_max.parameters is defined -%}
                        {{ test_stage(col.name + ': min_max', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL
                        AND ({{ colName }} < {{ col.min_max.parameters[0] }} OR {{ colName }} > {{ col.min_max.parameters[1] }})
                    {%- endif -%}
                    {%- if col.min_value is defined and col.min_value.parameters is defined -%}
                        {{ test_stage(col.name + ': min_value', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ colName }} < {{ col.min_value.parameters[0] }}
                    {%- endif -%}
                    {%- if col.max_value is defined and col.max_value.parameters is defined -%}
                        {{ test_stage(col.name + ': max_value', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ colName }} > {{ col.max_value.parameters[0] }}
                    {%- endif -%}
                    {%- if col.freshness is defined and col.freshness.parameters is defined -%}
                        {{ test_stage(col.name + ': freshness', columnContinueOnFailure) }}
                        SELECT MAX(CAST({{ colName }} AS DATETIME)) AS "LATEST_VALUE"
                        FROM {{ target }}
                        HAVING MAX(CAST({{ colName }} AS DATETIME)) IS NULL
                            OR MAX(CAST({{ colName }} AS DATETIME)) < DATEADD({{ col.freshness.parameters[1] | default('DAY', true) }}, -{{ col.freshness.parameters[0] }}, CURRENT_TIMESTAMP())
                    {%- endif -%}
                    {%- if col.relative_time is defined and col.relative_time.parameters is defined -%}
                        {%- set other = '"' + col.relative_time.parameters[1] + '"' -%}
                        {{ test_stage(col.name + ': relative_time', columnContinueOnFailure) }}
                        SELECT {{ colName }}, {{ other }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ other }} IS NOT NULL
                        AND NOT ({{ colName }} {{ col.relative_time.parameters[0] }} {{ other }})
                    {%- endif -%}
                {%- endfor -%}
            {%- endif -%}

            {%- set ns = namespace(cnt=0) -%}
            {%- for test in config.tests | default([]) -%}
                {%- if test is mapping and test.parameters is defined -%}
                    {%- if test.parameters[2] | default("After") == runOrder -%}
                        {%- set ns.cnt = ns.cnt + 1 -%}
                        {{ test_stage(
                            ('Pre Load Test ' if runOrder == 'Before' else 'Post Load Test ') ~ ns.cnt,
                            test.parameters[1] | default(true)
                        ) }}
                        {{ test.parameters[0] }}
                    {%- endif -%}
                {%- endif -%}
            {%- endfor -%}

        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    Description:
    Generates a deterministic hash value by combining and hashing all column values associated with the given `hash_name` using the `@inHash` annotation.

    Input: `hash_name` (string) - The hash group identifier used in `@inHash("<hash_name>")` to group columns for hashing.

    Output: - Returns a SQL expression of type `STRING`:
            - A SHA1 hash of concatenated column values  
            - Returns `NULL` if no columns are mapped to the given hash group
    ====================================================================================================#}
    {%- macro get_hash(hash_name, algo='SHA1', delimiter='||') -%}

        {%- set cols = namespace(items=[]) -%}
        {%- set algo_upper = algo | upper -%}

        {# Collect columns participating in this hash #}
        {%- for col in sources[0].columns -%}

            {%- if col.inHash is defined -%}
                {%- for p in col.inHash -%}
                    {%- set parts = p.parameters[0] %}
                    {%- set position = p.parameters[1] | int -%}
                    {%- set hash = p.parameters[0] -%}

                    {%- if hash == hash_name -%}
                        {%- set cols.items = cols.items + [{
                            "position": position,
                            "column": get_source_transform(col)
                        }] -%}
                    {%- endif -%}
                {%- endfor -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if cols.items | length == 0 -%}
            NULL
        {%- else -%}
            {%- set sorted_cols = cols.items | sort(attribute='position') -%}
            {# Define algo wrappers #}
            {%- set algo_start = algo_upper + '(' -%}
            {%- set algo_end = ')' -%}

            {%- if algo_upper == 'SHA256' -%}
                {%- set algo_start = 'SHA2(' -%}
                {%- set algo_end = ', 256)' -%}
            {%- endif -%}

            CAST(
                {{ algo_start }}
                    {%- for c in sorted_cols -%}
                        NVL(CAST({{ c.column }} AS VARCHAR), 'null')
                        {%- if not loop.last %}
                            || {%- if delimiter != '' %} '{{ delimiter }}' || {% endif -%}
                        {%- endif -%}
                    {%- endfor -%}
                {{ algo_end }}
            AS STRING)
        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    get_boolean_config(flag)

    Description:
        Extracts the boolean value of a configuration flag, supporting both
        annotation formats:
        - @flag
        - @flag(true) / @flag(false)

    Input:
        flag: Name of the boolean configuration flag, e.g. "truncateBefore",
            "testsEnabled", or "clusterDefined".

    Examples:
        @truncateBefore
        -> config["truncateBefore"] = true
        -> Output: true

        @truncateBefore(true)
        -> config["truncateBefore"] = { parameters: [true] }
        -> Output: true

        @truncateBefore(false)
        -> config["truncateBefore"] = { parameters: [false] }
        -> Output: false

        No annotation
        -> config["truncateBefore"] is not defined
        -> Output: empty

    Usage:
        {% if get_boolean_config("truncateBefore") | trim | lower == "true" %}
        ...
        {% endif %}
    ====================================================================================================#}
    {%- macro get_boolean_config(flag) -%}
        {%- if config[flag] is defined -%}
            {%- if config[flag] is boolean -%}
                {{- config[flag] | trim | lower -}}
            {%- elif config[flag].parameters is defined and config[flag].parameters|length > 0 -%}
                {{- config[flag].parameters[0] | trim | lower -}}
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#====================================================================================================
    Description:
        Validates a Dimension node's annotation configuration and stages a failing (or, for one
        specific case, warning-only) test for anything wrong or missing, before any of the actual
        create/run logic runs. Shared here so create.sql.j2 and run.sql.j2 both enforce the exact
        same rules from a single place instead of duplicating the checks in each template.

        Checks performed, in order:
        1. @isBusinessKey — at least one column must be marked (hard fail).
        2. @lastModifiedTracking — at most one column may be marked (hard fail).
        3. @mergeStrategy — cross-checks between the explicit/inferred strategy and the
           @lastModifiedTracking/@isChangeTracking annotations actually present (hard fail).
        4. @isSystemCreateDate — required whenever the merge strategy is changeTracking/lastModified
           (i.e. not a plain @upsert), since the SCD1/SCD2 merge logic looks this column up by
           attribute and splices its name directly into generated SQL (hard fail).
        5. @isSystemUpdateDate — same lookup-by-attribute dependency, but only for SCD Type 2;
           for SCD Type 1 it's merely recommended (an audit-trail gap, not a broken merge), so
           SCD Type 2 is a hard fail and SCD Type 1 is a warning.
        6. @isSystemVersion / @isSystemCurrentFlag / @isSystemEndDate — required only for SCD
           Type 2 dimensions, where each is looked up by attribute and spliced into the merge
           (hard fail).
        7. @isSurrogateKey — optional in general (a customer may manage it themselves, e.g. via
           SEQ.NEXTVAL, in their own SELECT logic), but required when @zeroKey is configured,
           since the zero-key MERGE needs a surrogate key column to match against (hard fail).

    Inputs: none — reads columns/config from the surrounding node context directly.

    Output: Rendered test_stage(...) calls (with their SELECT 1 probe body) for every check
            that fails; nothing is rendered for checks that pass.
    ====================================================================================================#}
    {%- macro validate_dimension_requirements() -%}
        {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) %}
        {%- if not hasBusinessKey %}
            {{ test_stage("Missing Business Key", false) }}
            -- Mark at least one column with @isBusinessKey to identify the dimension's natural/business key for SCD matching.
            SELECT 1
        {%- endif %}

        {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length %}
        {%- set changeTrackingCount = columns | selectattr("isChangeTracking") | list | length %}

        {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 %}
        {%- if mergeStrategyExplicit %}
            {%- set mergeStrategy = config.mergeStrategy.parameters[0] | trim %}
        {%- elif lastModifiedCount > 0 %}
            {# == No @mergeStrategy given — infer it the same way older nodes without the annotation
                 always worked: an @lastModifiedTracking column present means last-modified comparison. == #}
            {%- set mergeStrategy = 'lastModified' %}
        {%- else %}
            {%- set mergeStrategy = 'changeTracking' %}
        {%- endif %}
        {%- set isSimpleUpsert = mergeStrategy == 'upsert' %}
        {%- set isLastModifiedStrategy = mergeStrategy == 'lastModified' %}
        {%- set isChangeTrackingStrategy = mergeStrategy == 'changeTracking' %}

        {#== The strict cross-checks below only apply when @mergeStrategy is set explicitly — an
             inferred strategy is derived FROM whatever's marked, so it can never conflict with it. ==#}
        {%- if mergeStrategyExplicit and isSimpleUpsert and (lastModifiedCount > 0 or changeTrackingCount > 0) %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- @mergeStrategy("upsert") performs no change detection, so @isChangeTracking/@lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "changeTracking"/"lastModified" to use them.
            SELECT 1
        {%- endif %}

        {%- if isChangeTrackingStrategy and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
            SELECT 1
        {%- endif %}

        {%- if isLastModifiedStrategy and lastModifiedCount == 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- @mergeStrategy("lastModified") requires exactly one column marked @lastModifiedTracking; none was found.
            SELECT 1
        {%- endif %}

        {#== Cardinality only matters once we know lastModified is the strategy actually in effect —
             under changeTracking/upsert, stray @lastModifiedTracking columns (any count) are already
             flagged above as unused annotations; piling on a redundant "at most one" complaint about
             columns that were mistakenly added in the first place would just be noise. ==#}
        {%- if isLastModifiedStrategy and lastModifiedCount > 1 %}
            {{ test_stage('Invalid configuration: Last Modified Column', false) }}
            -- @lastModifiedTracking may be applied to at most one column, but {{ lastModifiedCount }} columns were marked. Remove the annotation from all but one column.
            SELECT 1
        {%- endif %}

        {%- if isLastModifiedStrategy and changeTrackingCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- @mergeStrategy("lastModified") does not use @isChangeTracking — those columns would be silently ignored (the last-modified comparison takes priority). Remove them, or switch mergeStrategy to "changeTracking" to use them.
            SELECT 1
        {%- endif %}

        {%- set lastModifiedComparison = isLastModifiedStrategy and lastModifiedCount > 0 %}
        {%- if hasBusinessKey %}
            {%- if lastModifiedComparison %}
                {#== lastModifiedCount > 1 is already flagged above as its own cardinality error —
                     deriving scdType/type2Dimension from an arbitrary "first" pick among several
                     mismarked columns would only cascade into further misleading errors (e.g.
                     demanding SCD2 system columns based on a column that isn't even "the" one).
                     Treat it as inconclusive (plain SCD1) until the cardinality is actually fixed. ==#}
                {%- if lastModifiedCount == 1 %}
                    {%- set lastModifiedCol = columns | selectattr("lastModifiedTracking") | first %}
                    {%- set scdType = lastModifiedCol.lastModifiedTracking.parameters[0] | default(1, true) | string %}
                    {%- if scdType not in ('1', '2') %}
                        {{ test_stage('Invalid configuration: lastModifiedTracking scdType', false) }}
                        -- @lastModifiedTracking's scdType parameter only accepts 1 or 2, but "{{ scdType }}" was given on column {{ lastModifiedCol.name }}. Use scdType(1) to overwrite in place, or scdType(2) to version the row.
                        SELECT 1
                    {%- endif %}
                    {%- set type2Dimension = scdType == '2' %}
                {%- else %}
                    {%- set type2Dimension = false %}
                {%- endif %}
            {%- else %}
                {%- set type2Dimension = changeTrackingCount > 0 %}
            {%- endif %}
        {%- else %}
            {%- set type2Dimension = false %}
        {%- endif %}
        {%- if isSimpleUpsert %}
            {# @upsert always forces plain SCD1 — no change detection, no versioning — regardless
               of any @lastModifiedTracking/@isChangeTracking annotations present on the node. #}
            {%- set type2Dimension = false %}
        {%- endif %}

        {#== System columns below are only read/written once change detection is active (i.e. not
             a plain @upsert) — see the SCD1/SCD2 CTE blocks in run.sql.j2. ==#}
        {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 %}
        {%- if not isSimpleUpsert and not hasSystemCreateDate %}
            {{ test_stage("Missing System Create Date Column", false) }}
            -- Mark a column with @isSystemCreateDate — for example:
            -- CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate
            -- Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.
            SELECT 1
        {%- endif %}

        {#== SYSTEM_UPDATE_DATE: hard-required for SCD Type 2 (the merge looks it up by attribute
             and stamps it on every inserted version); for SCD Type 1 it's only set inline per-row
             if present, so its absence is a soft warning about lost update-audit info rather than
             something that breaks the generated SQL. ==#}
        {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 %}
        {%- if not isSimpleUpsert and not hasSystemUpdateDate %}
            {{ test_stage("Missing System Update Date Column", not type2Dimension) }}
            -- Mark a column with @isSystemUpdateDate — for example:
            -- CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate
            {%- if type2Dimension %}
            -- Required because this is an SCD Type 2 dimension: SYSTEM_UPDATE_DATE is carried through from the current target row into CHANGE_DETECTION/MERGE_ROWS so it can be stamped with CURRENT_TIMESTAMP whenever a new or changed version is inserted, marking when that version became active.
            {%- else %}
            -- Recommended for SCD Type 1: without it there's no way to tell when a row's attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again. Not required for the merge to run correctly, so this is a warning rather than a hard failure.
            {%- endif %}
            SELECT 1
        {%- endif %}

        {#== The remaining system columns are only required for SCD Type 2 dimensions — SCD Type 1
             tracks neither version history nor row expiry. ==#}
        {%- if type2Dimension %}
            {%- set hasSystemVersion = columns | selectattr("isSystemVersion") | list | length > 0 %}
            {%- if not hasSystemVersion %}
                {{ test_stage("Missing System Version Column", false) }}
                -- Mark a column with @isSystemVersion — for example:
                -- 1 AS "SYSTEM_VERSION" @isSystemVersion
                -- Required because this is an SCD Type 2 dimension (a versioned last-modified column, or an @isChangeTracking column, was found): SYSTEM_VERSION is what distinguishes successive versions of the same business key, and it's what the outer MERGE's ON clause uses (alongside the business key) to target the exact row version being expired or matched.
                SELECT 1
            {%- endif %}

            {%- set hasSystemCurrentFlag = columns | selectattr("isSystemCurrentFlag") | list | length > 0 %}
            {%- if not hasSystemCurrentFlag %}
                {{ test_stage("Missing System Current Flag Column", false) }}
                -- Mark a column with @isSystemCurrentFlag — for example:
                -- 'Y' AS "SYSTEM_CURRENT_FLAG" @isSystemCurrentFlag
                -- Required because this is an SCD Type 2 dimension: the CHANGE_DETECTION CTE filters TARGET_CURRENT down to WHERE SYSTEM_CURRENT_FLAG = 'Y' to find the one active row per business key to compare the incoming source row against — without it there's no way to tell which of possibly several historical versions is the current one.
                SELECT 1
            {%- endif %}

            {%- set hasSystemEndDate = columns | selectattr("isSystemEndDate") | list | length > 0 %}
            {%- if not hasSystemEndDate %}
                {{ test_stage("Missing System End Date Column", false) }}
                -- Mark a column with @isSystemEndDate — for example:
                -- CAST('2999-12-31 00:00:00' AS TIMESTAMP) AS "SYSTEM_END_DATE" @isSystemEndDate
                -- Required because this is an SCD Type 2 dimension: SYSTEM_END_DATE is what gets set to the expiry timestamp when a changed row's prior version is expired, and to the far-future sentinel on every newly inserted current version — without it there's no way to bound how long each historical version was active.
                SELECT 1
            {%- endif %}
        {%- endif %}

        {#== A surrogate key column (@isSurrogateKey) is optional — a customer may instead manage
             it themselves in their own SELECT logic (e.g. SEQ.NEXTVAL). It's only required when
             @zeroKey needs a surrogate key column to match the zero record against. ==#}
        {%- set hasSurrogateKey = columns | selectattr("isSurrogateKey") | list | length > 0 %}
        {%- if config.zeroKey is defined and not hasSurrogateKey %}
            {{ test_stage("Missing Surrogate Key", false) }}
            -- @zeroKey requires a surrogate key column (@isSurrogateKey) to match the zero record against; none was found on this node.
            SELECT 1
        {%- endif %}
    {%- endmacro -%}
name: macro
type: Macro
