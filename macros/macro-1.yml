fileVersion: 1
id: "1"
macroString: |-
    {#===========================================================================
      Shorthand aliases for node types that use the advanced deployment
      strategy: columns, storageLocations, config, sources, node and
      parameters point at desiredState, so templates and macros can use them
      directly.
    ===========================================================================#}
    {%- if desiredState -%}
        {%- set columns = desiredState.columns -%}
        {%- set storageLocations = desiredState.storageLocations -%}
        {%- set config = desiredState.config -%}
        {%- set sources = desiredState.sources -%}
        {%- set node = desiredState.node -%}
        {%- set parameters = desiredState.parameters -%}
    {%- endif -%}

    {#===========================================================================
      Initialize variables for node types that use the 
      advanced deployment strategy
    ===========================================================================#}
    {%- macro initializeNodeVariables(nsNodeVariables) -%}

      {%- if currentState is defined and currentState -%}
        {%- set currentDatabase = currentState.storageLocations 
                                  | selectattr('name', 'equalto', currentState.node.location.name)
                                  | map(attribute='database')
                                  | first -%}
        {%- set currentSchema = currentState.storageLocations
                                | selectattr('name', 'equalto', currentState.node.location.name)
                                | map(attribute='schema')
                                | first -%}
        {%- set nsNodeVariables.currentDatabaseSchema = currentDatabase + '.' + currentSchema -%}

        {%- set nsNodeVariables.curObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name) -%}

      {%- endif -%}

      {%- if desiredState is defined and desiredState -%}
        {%- set desiredDatabase = storageLocations
                                  | selectattr('name', 'equalto', node.location.name)
                                  | map(attribute='database')
                                  | first -%}
        {%- set desiredSchema = storageLocations
                                  | selectattr('name', 'equalto', node.location.name)
                                  | map(attribute='schema')
                                  | first -%}
        {%- set nsNodeVariables.desiredDatabaseSchema = desiredDatabase + '.' + desiredSchema -%}

        {%- set nsNodeVariables.desObjectNameFullPath = ref_no_link(node.location.name, node.name) -%}

      {%- endif -%}

      {#- Redeploy: current columns with no desired match by id or by name are being dropped #}
      {%- if currentState is defined and currentState and desiredState is defined and desiredState -%}
        {%- for curCol in currentState.columns -%}
          {%- set idStillDesired = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
          {%- set nameStillDesired = curCol.name in (columns | default([]) | map(attribute='name') | list) -%}
          {%- if not idStillDesired and not nameStillDesired -%}
            {%- set nsNodeVariables.droppedColumns = nsNodeVariables.droppedColumns + ['"' + curCol.name + '"'] -%}
          {%- endif -%}
          {#- Same id, new name: the column is renamed (old name recorded) #}
          {%- if idStillDesired and (idStillDesired | first).name != curCol.name -%}
            {%- set nsNodeVariables.renamedColumns = nsNodeVariables.renamedColumns + ['"' + curCol.name + '"'] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}

      {#- Cluster key terms from @clusterKey(<position>, "<expression>"), ordered by position.
          A term is the expression, or the quoted column name when none is given. #}
      {%- set nsCluster = namespace(desired=[], current=[]) -%}
      {%- if desiredState is defined and desiredState -%}
        {%- for col in columns -%}
          {%- for cluster in col.clusterKey | default([]) -%}
            {%- set nsCluster.desired = nsCluster.desired + [{"position": cluster.parameters[0] | int,
                                                               "term": cluster.parameters[1] | default('"' + col.name + '"', true)}] -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set nsNodeVariables.desiredClusterKey = nsCluster.desired | sort(attribute='position') | map(attribute='term') | list -%}
      {%- endif -%}
      {%- if currentState is defined and currentState -%}
        {%- for col in currentState.columns -%}
          {%- for cluster in col.clusterKey | default([]) -%}
            {%- set nsCluster.current = nsCluster.current + [{"position": cluster.parameters[0] | int,
                                                               "term": cluster.parameters[1] | default('"' + col.name + '"', true)}] -%}
          {%- endfor -%}
          {%- if col.clusterKey | default([]) | length > 0 -%}
            {%- set nsNodeVariables.currentClusterKeyColumns = nsNodeVariables.currentClusterKeyColumns + ['"' + col.name + '"'] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set nsNodeVariables.currentClusterKey = nsCluster.current | sort(attribute='position') | map(attribute='term') | list -%}
      {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
      Shared node variables for node types that use the advanced deployment
      strategy, created and initialized once per render — every node renders
      the macros + its own template separately, so nothing is shared between
      nodes. Templates and the alter_ macros use nsNodeVariables
      directly:
        currentDatabaseSchema / desiredDatabaseSchema : "DB.SCHEMA"
        curObjectNameFullPath / desObjectNameFullPath : "DB"."SCHEMA"."NAME"
        droppedColumns  : quoted names of current columns being dropped, e.g. ['"A"', '"B"']
                          (redeploy only; read by alter_drop_columns_sql and the cluster-key macros)
        renamedColumns  : quoted current (old) names of columns being renamed — same id, new name
                          (redeploy only; read by the cluster-key macros)
        desiredClusterKey / currentClusterKey : CLUSTER BY terms ordered by position,
                          e.g. ['"N_REGIONKEY"', 'trunc("N_NAME", -5)']
        currentClusterKeyColumns : quoted names of current columns carrying @clusterKey
        clusterKeyDropped : set true by alter_drop_cluster_key_sql when it drops the key early
        metaDataChanged : set true by any redeploy stage that changes the object
      Paths stay empty when the corresponding state is absent (e.g. no
      currentState on a first deploy, neither state on non-advanced node types).
    ===========================================================================#}
    {%- set nsNodeVariables = namespace(currentDatabaseSchema = "",
                                        desiredDatabaseSchema = "",
                                        desObjectNameFullPath = "",
                                        curObjectNameFullPath = "",
                                        droppedColumns = [],
                                        renamedColumns = [],
                                        desiredClusterKey = [],
                                        currentClusterKey = [],
                                        currentClusterKeyColumns = [],
                                        clusterKeyDropped = false,
                                        metaDataChanged = false) -%}
    {{- initializeNodeVariables(nsNodeVariables) -}}
    {#===========================================================================
    Purpose          : Executes data quality tests associated with the node
                      and its columns, based on the configured run order.
                      Supports running tests either before or after data
                      insertion, and respects the test continuation
                      behavior on failure.
    Input Parameters : runOrder (String)
                      - Determines when the tests should be executed.
                          Expected values: 'Before' or 'After'
    Returns          : Rendered SQL statements for executing the applicable
                      node-level and column-level data quality tests.
                      No output is generated if tests are disabled.
    ===========================================================================#}
    {%- macro run_tests(runOrder) -%}

        {%- set columnContinueOnFailure = true -%}

        {%- if get_boolean_config("disableTests") != "true" -%}
            {%- if runOrder == "After" -%}
                {%- for col in columns -%}
                    {%- set colName = '"' + col.name + '"' -%}
                    {%- set target = ref(node.location.name, node.name) -%}
                    {%- if col.not_null is defined -%}
                        {{ test_stage(col.name + ': not_null', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NULL
                    {%- endif -%}
                    {%- if col.uniqueness is defined -%}
                        {{ test_stage(col.name + ': uniqueness', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        GROUP BY {{ colName }}
                        HAVING COUNT(*) > 1
                    {%- endif -%}
                    {%- if col.empty is defined -%}
                        {{ test_stage(col.name + ': empty', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND TRIM({{ colName }}) = ''
                    {%- endif -%}
                    {%- set nsAccepted = namespace(values=[]) -%}
                      {%- for v in col.accepted_values | default([]) -%}
                          {%- for p in v.parameters | default([]) -%}
                              {%- for val in (p | string).split(',') -%}
                                  {%- set nsAccepted.values = nsAccepted.values + [val.strip()] -%}
                              {%- endfor -%}
                          {%- endfor -%}
                      {%- endfor -%}
                      {%- if nsAccepted.values | length > 0 -%}
                          {{ test_stage(col.name + ': accepted_values', columnContinueOnFailure) }}
                          SELECT {{ colName }}
                          FROM {{ target }}
                          WHERE {{ colName }} IS NOT NULL
                          AND {{ colName }} NOT IN ({{ nsAccepted.values | join(', ') }})
                      {%- endif -%}
                      {%- set nsRejected = namespace(values=[]) -%}
                      {%- for v in col.rejected_values | default([]) -%}
                          {%- for p in v.parameters | default([]) -%}
                              {%- for val in (p | string).split(',') -%}
                                  {%- set nsRejected.values = nsRejected.values + [val.strip()] -%}
                              {%- endfor -%}
                          {%- endfor -%}
                      {%- endfor -%}
                      {%- if nsRejected.values | length > 0 -%}
                          {{ test_stage(col.name + ': rejected_values', columnContinueOnFailure) }}
                          SELECT {{ colName }}
                          FROM {{ target }}
                          WHERE {{ colName }} IN ({{ nsRejected.values | join(', ') }})
                      {%- endif -%}
                    {%- if col.min_max is defined and col.min_max.parameters is defined -%}
                        {{ test_stage(col.name + ': min_max', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL
                        AND ({{ colName }} < {{ col.min_max.parameters[0] }} OR {{ colName }} > {{ col.min_max.parameters[1] }})
                    {%- endif -%}
                    {%- if col.min_value is defined and col.min_value.parameters is defined -%}
                        {{ test_stage(col.name + ': min_value', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ colName }} < {{ col.min_value.parameters[0] }}
                    {%- endif -%}
                    {%- if col.max_value is defined and col.max_value.parameters is defined -%}
                        {{ test_stage(col.name + ': max_value', columnContinueOnFailure) }}
                        SELECT {{ colName }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ colName }} > {{ col.max_value.parameters[0] }}
                    {%- endif -%}
                    {%- if col.freshness is defined and col.freshness.parameters is defined -%}
                        {{ test_stage(col.name + ': freshness', columnContinueOnFailure) }}
                        SELECT MAX(CAST({{ colName }} AS DATETIME)) AS "LATEST_VALUE"
                        FROM {{ target }}
                        HAVING MAX(CAST({{ colName }} AS DATETIME)) IS NULL
                            OR MAX(CAST({{ colName }} AS DATETIME)) < DATEADD({{ col.freshness.parameters[1] | default('DAY', true) }}, -{{ col.freshness.parameters[0] }}, CURRENT_TIMESTAMP())
                    {%- endif -%}
                    {%- if col.relative_time is defined and col.relative_time.parameters is defined -%}
                        {%- set other = '"' + col.relative_time.parameters[1] + '"' -%}
                        {{ test_stage(col.name + ': relative_time', columnContinueOnFailure) }}
                        SELECT {{ colName }}, {{ other }}
                        FROM {{ target }}
                        WHERE {{ colName }} IS NOT NULL AND {{ other }} IS NOT NULL
                        AND NOT ({{ colName }} {{ col.relative_time.parameters[0] }} {{ other }})
                    {%- endif -%}
                {%- endfor -%}
            {%- endif -%}

            {%- set ns = namespace(cnt=0) -%}
            {%- for test in config.tests | default([]) -%}
                {%- if test is mapping and test.parameters is defined -%}
                    {%- if test.parameters[2] | default("After") == runOrder -%}
                        {%- set ns.cnt = ns.cnt + 1 -%}
                        {{ test_stage(
                            ('Pre Load Test ' if runOrder == 'Before' else 'Post Load Test ') ~ ns.cnt,
                            test.parameters[1] | default(true)
                        ) }}
                        {{ test.parameters[0] }}
                    {%- endif -%}
                {%- endif -%}
            {%- endfor -%}

        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    Description:
    Generates a deterministic hash value by combining and hashing all column values associated with the given `hash_name` using the `@inHash` annotation.

    Input: `hash_name` (string) - The hash group identifier used in `@inHash("<hash_name>")` to group columns for hashing.

    Output: - Returns a SQL expression of type `STRING`:
          - A SHA1 hash of concatenated column values  
          - Returns `NULL` if no columns are mapped to the given hash group
    ===========================================================================#}
    {%- macro get_hash(hash_name, algo='SHA1', delimiter='||') -%}

        {%- set cols = namespace(items=[]) -%}
        {%- set algo_upper = algo | upper -%}

        {# Collect columns participating in this hash #}
        {%- for col in sources[0].columns -%}

            {%- if col.inHash is defined -%}
                {%- for p in col.inHash -%}
                    {%- set position = p.parameters[1] | int -%}
                    {%- set hash = p.parameters[0] -%}

                    {%- if hash == hash_name -%}
                        {%- set cols.items = cols.items + [{
                            "position": position,
                            "column": get_source_transform(col)
                        }] -%}
                    {%- endif -%}
                {%- endfor -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if cols.items | length == 0 -%}
            NULL
        {%- else -%}
            {%- set sorted_cols = cols.items | sort(attribute='position') -%}
            {# Define algo wrappers #}
            {%- set algo_start = algo_upper + '(' -%}
            {%- set algo_end = ')' -%}

            {%- if algo_upper == 'SHA256' -%}
                {%- set algo_start = 'SHA2(' -%}
                {%- set algo_end = ', 256)' -%}
            {%- endif -%}

            CAST(
                {{ algo_start }}
                    {%- for c in sorted_cols -%}
                        NVL(CAST({{ c.column }} AS VARCHAR), 'null')
                        {%- if not loop.last %}
                            || {%- if delimiter != '' %} '{{ delimiter }}' || {% endif -%}
                        {%- endif -%}
                    {%- endfor -%}
                {{ algo_end }}
            AS STRING)
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    get_boolean_config(flag)

    Description:
      Extracts the boolean value of a configuration flag, supporting both
      annotation formats:
        - @flag
        - @flag(true) / @flag(false)

    Input:
      flag: Name of the boolean configuration flag, e.g. "truncateBefore",
            "testsEnabled", or "clusterDefined".

    Examples:
      @truncateBefore
        -> config["truncateBefore"] = true
        -> Output: true

      @truncateBefore(true)
        -> config["truncateBefore"] = { parameters: [true] }
        -> Output: true

      @truncateBefore(false)
        -> config["truncateBefore"] = { parameters: [false] }
        -> Output: false

      No annotation
        -> config["truncateBefore"] is not defined
        -> Output: empty

    Usage:
      {% if get_boolean_config("truncateBefore") | trim | lower == "true" %}
        ...
      {% endif %}
    ===========================================================================#}
    {%- macro get_boolean_config(flag) -%}
        {%- if config[flag] is defined -%}
            {%- if config[flag] is boolean -%}
                {{- config[flag] | trim | lower -}}
            {%- elif config[flag].parameters is defined and config[flag].parameters|length > 0 -%}
                {{- config[flag].parameters[0] | trim | lower -}}
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    Description: Resolves the zero-key literal for a column (column-level @zeroKey wins, else node-level @zeroKey by dataType, else NULL).
    Input: col (object)
    Output: SQL literal for the resolved zero-key value.
    ===========================================================================#}
    {%- macro resolve_zero_key(col) -%}

        {%- set ns = namespace(zk_type=none, zk_value=none) -%}

        {# Column-level zeroKey #}
        {%- if col.zeroKey is defined
            and col.zeroKey.parameters is defined
            and col.zeroKey.parameters | trim | length > 0 -%}

            {%- set ns.zk_value = col.zeroKey.parameters[0] -%}

        {# Node-level zeroKey, matched by column dataType #}
        {%- else -%}
            {%- set zkParams = config.zeroKey.parameters if (config.zeroKey is defined and config.zeroKey.parameters is defined) else [] -%}
            {%- if col.dataType | upper == 'VARIANT' -%}
                {%- set ns.zk_type = 'variant' -%}
                {%- set ns.zk_value = none -%}
            {%- elif col.dataType[:3] | upper in ('VAR', 'CHA', 'STR', 'TEX') -%}
                {%- set ns.zk_type = 'string' -%}
                {%- set ns.zk_value = zkParams[1] if zkParams | length > 1 else "'UNKNOWN'" -%}
            {# Every numeric type (NUMBER/NUMERIC/DECIMAL, INT/INTEGER/BIGINT/SMALLINT/TINYINT/BYTEINT, FLOAT/DOUBLE/REAL) always gets 0 —
               the node-level surrogateKeyValue applies to the surrogate key column only; override per column with @zeroKey(value). #}
            {%- elif col.dataType[:3] | upper in ('NUM', 'INT', 'DEC', 'FLO', 'DOU', 'REA', 'BIG', 'SMA', 'TIN', 'BYT') -%}
                {%- set ns.zk_type = 'numeric' -%}
                {%- set ns.zk_value = 0 -%}
            {%- elif col.dataType | upper == 'BOOLEAN' -%}
                {%- set ns.zk_type = 'boolean' -%}
                {%- set ns.zk_value = zkParams[3] if zkParams | length > 3 else true -%}
            {%- elif col.dataType[:4] | upper in ('DATE', 'TIME', 'TIMESTAMP') -%}
                {%- set ns.zk_type = 'datetime' -%}
                {%- set ns.zk_value = zkParams[2] if zkParams | length > 2 else '1900-01-01 00:00:00' -%}
            {%- endif -%}
        {%- endif -%}

        {# Format the resolved value #}
        {%- if ns.zk_type == 'numeric' -%}
            {{ ns.zk_value }}
        {%- elif ns.zk_type == 'variant' -%}
            PARSE_JSON('null')
        {%- elif ns.zk_value is not none -%}
            {%- if ns.zk_type == 'boolean' -%}
                {{ ns.zk_value | upper }}

            {%- elif ns.zk_type == 'datetime' -%}
                TO_TIMESTAMP('{{ ns.zk_value }}')

            {%- elif ns.zk_type == 'string' -%}
                {# Node-level default: pasted verbatim, same as the column-level override — supply your own quotes in the annotation, e.g. "'UNKNOWN'". #}
                {{ ns.zk_value }}

            {%- else -%}
                {# Column-level @zeroKey override: pasted verbatim, exactly as the user wrote it — #}
                {# they supply their own quotes for a string, or a full expression like CAST(...). #}
                {{ ns.zk_value }}
            {%- endif -%}

        {%- else -%}
            NULL
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
    Description: Builds a datatype-aware condition that's TRUE when the source and target values differ.
    Input: src_expr (string), tgt_expr (string), data_type (string)
    Output: SQL boolean condition.
    ===========================================================================#}
    {%- macro safe_compare(src_expr, tgt_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt or 'GEOMETRY' in dt -%}
            ST_ASWKB({{ src_expr }}) IS DISTINCT FROM ST_ASWKB({{ tgt_expr }})
        {%- else -%}
            {{ src_expr }} IS DISTINCT FROM {{ tgt_expr }}
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
    Description: Builds a datatype-aware equality condition for matching business keys. GEOGRAPHY/GEOMETRY can't be compared with =, so they're compared on their WKB binary form (exact match, still an equi-join).
    Input: left_expr (string), right_expr (string), data_type (string)
    Output: SQL boolean condition. NULL never matches, same as =.
    ===========================================================================#}
    {%- macro safe_equals(left_expr, right_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt or 'GEOMETRY' in dt -%}
            ST_ASWKB({{ left_expr }}) = ST_ASWKB({{ right_expr }})
        {%- else -%}
            {{ left_expr }} = {{ right_expr }}
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
    Description: Checks that every column carries its own @id annotation, reporting duplicate column names and repeated @id values separately. Shared by validate_dimension_requirements and validate_fact_requirements.
    Input: hardFail (boolean, default false) — passed through from the calling validator.
    Output: Rendered test_stage(...) + SELECT statements for every check that fails.
    ===========================================================================#}
    {%- macro validate_column_ids(hardFail=false) -%}
        {# A column without a real @id has id equal to its name. When the SELECT repeats a column name, Coalesce renames the extra copy by appending a number (SYSTEM_CREATE_DATE -> SYSTEM_CREATE_DATE1) and drops its @id, so it lands here too — report that as a duplicate name rather than a missing ID. #}
        {%- set idCheck = namespace(missing=[], duplicates=[]) -%}
        {%- for col in columns if col.id == col.name -%}
            {%- set dup = namespace(of=none) -%}
            {%- for other in columns if other.name != col.name and col.name[:other.name | length] == other.name -%}
                {%- set suffix = col.name[other.name | length:] -%}
                {%- if (suffix | int(0)) > 0 and (suffix | int) | string == suffix -%}
                    {%- set dup.of = other.name -%}
                {%- endif -%}
            {%- endfor -%}
            {%- if dup.of is not none -%}
                {%- set idCheck.duplicates = idCheck.duplicates + [{"of": dup.of, "renamed": col.name}] -%}
            {%- else -%}
                {%- set idCheck.missing = idCheck.missing + [col.name] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if idCheck.duplicates | length > 0 %}
            {%- set described = namespace(items=[]) -%}
            {%- for d in idCheck.duplicates -%}
                {%- set described.items = described.items + ["'" ~ d.of ~ "' (extra copy renamed to " ~ d.renamed ~ ")"] -%}
            {%- endfor -%}
            {# A deliberate alias like REGIONKEY1 without an @id is indistinguishable from a renamed copy, so the message covers both. #}
            {%- set renamed = idCheck.duplicates | map(attribute='renamed') | list -%}
            {%- if renamed | length > 1 -%}
                {%- set aliasHint = "If " ~ (renamed | join(', ')) ~ ' are deliberate aliases rather than copies, add a unique @id("<6 hex digits>") to each of them instead.' -%}
            {%- else -%}
                {%- set aliasHint = "If " ~ renamed[0] ~ ' is a deliberate alias rather than a copy, add a unique @id("<6 hex digits>") to it instead.' -%}
            {%- endif -%}
            {%- set reason = "Duplicate column name: " ~ (described.items | join(', ')) ~ ". The SELECT returns more than one column with the same name — remove the extra column or give it a different alias. " ~ aliasHint %}
            {{ test_stage("Duplicate Column Names", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}

        {# Two columns given the same @id value (exact string match). #}
        {%- set idDup = namespace(items=[]) -%}
        {%- for col in columns if col.id != col.name -%}
            {%- set sharing = columns | selectattr("id", "equalto", col.id) | map(attribute="name") | list -%}
            {%- set entry = "@id(\"" ~ col.id ~ "\") on " ~ (sharing | join(', ')) -%}
            {%- if sharing | length > 1 and entry not in idDup.items -%}
                {%- set idDup.items = idDup.items + [entry] -%}
            {%- endif -%}
        {%- endfor -%}
        {%- if idDup.items | length > 0 %}
            {%- set reason = "Duplicate column ID: " ~ (idDup.items | join('; ')) ~ '. Each column needs its own unique @id("<6 hex digits>") — change the repeated ID on all but one of them.' %}
            {{ test_stage("Duplicate Column IDs", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}

        {%- if idCheck.missing | length > 0 %}
            {%- set reason = "These columns have no real system-generated ID (id equals the column name): " ~ (idCheck.missing | join(', ')) ~ '. Add a unique @id("<6 hex digits>") annotation to each of them.' %}
            {{ test_stage("Missing Column IDs", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    Description: Validates a Dimension node's annotations (column IDs, business key, mergeStrategy, required system columns). Shared by create.sql.j2 and run.sql.j2.
    Input: hardFail (boolean, default false) — set true from create.sql.j2 so a failed check raises a real SQL error, since CREATE (unlike RUN) doesn't fail on row count alone.
    Output: Rendered test_stage(...) + SELECT statements for every check that fails.
    ===========================================================================#}
    {%- macro validate_dimension_requirements(hardFail=false) -%}
        {# CREATE doesn't fail on row count like RUN does, so hardFail forces a real SQL error instead. #}
        {%- macro fail_select(reason) -%}
            {%- if hardFail -%}
                SELECT 1/0
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endmacro -%}

        {# Every Dimension column must carry its own @id annotation. #}
        {{ validate_column_ids(hardFail) }}

        {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}
        {%- if not hasBusinessKey %}
            {%- set reason = "Mark at least one column with @isBusinessKey to identify the dimension's natural/business key for SCD matching." %}
            {{ test_stage("Missing Business Key", false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}
        {%- set changeTrackingCount = columns | selectattr("isChangeTracking") | list | length -%}

        {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
        {%- if mergeStrategyExplicit -%}
            {# Matched case-insensitively (must match run.sql.j2). #}
            {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
            {%- set mergeStrategy = mergeStrategyRaw | lower -%}
        {%- else -%}
            {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
            {%- set mergeStrategy = 'changetracking' -%}
        {%- endif -%}
        {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
        {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
        {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' %}

        {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
        {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
            {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") is not a recognised strategy. Use "changeTracking", "lastModified" or "upsert".' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can't conflict with itself. #}
        {%- if mergeStrategyExplicit and isSimpleUpsert and (lastModifiedCount > 0 or changeTrackingCount > 0) %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("upsert") performs no change detection, so @isChangeTracking/@lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "changeTracking"/"lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {%- if isChangeTrackingStrategy and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
            SELECT 1
        {%- endif -%}

        {%- if isLastModifiedStrategy and lastModifiedCount == 0 %}
            {%- set reason = '@mergeStrategy("lastModified") requires exactly one column marked @lastModifiedTracking(<scdType>); none was found.' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif %}

        {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
        {%- if isLastModifiedStrategy and lastModifiedCount > 1 %}
            {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
            {{ test_stage('Invalid configuration: Last Modified Column', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {%- if isLastModifiedStrategy and changeTrackingCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("lastModified") does not use @isChangeTracking — those columns would be silently ignored (the last-modified comparison takes priority). Remove them, or switch mergeStrategy to "changeTracking" to use them.
            SELECT 1
        {%- endif -%}

        {%- set lastModifiedComparison = isLastModifiedStrategy and lastModifiedCount > 0 -%}
        {%- if hasBusinessKey -%}
            {%- if lastModifiedComparison %}
                {# More than one @lastModifiedTracking column is already flagged above — treat it as inconclusive (plain SCD1) until that's fixed. #}
                {%- if lastModifiedCount == 1 -%}
                    {%- set lastModifiedCol = columns | selectattr("lastModifiedTracking") | first %}
                    {# A bare @lastModifiedTracking (no scdType) comes through as `true`, not a mapping — guard for that and default scdType to 1. #}
                    {%- set lastModifiedTrackingParams = lastModifiedCol.lastModifiedTracking.parameters if (lastModifiedCol.lastModifiedTracking is mapping and lastModifiedCol.lastModifiedTracking.parameters is defined) else [] -%}
                    {%- set scdType = lastModifiedTrackingParams[0] | default(1, true) | string -%}
                    {%- if scdType not in ('1', '2') %}
                        {%- set reason = '@lastModifiedTracking\'s scdType parameter only accepts 1 or 2, but "' ~ scdType ~ '" was given on column ' ~ lastModifiedCol.name ~ '. Mention @lastModifiedTracking(scdType) explicitly — @lastModifiedTracking(1) to overwrite in place, or @lastModifiedTracking(2) to version the row.' %}
                        {{ test_stage('Invalid configuration: lastModifiedTracking scdType', false) }}
                        -- {{ reason }}
                        {{ fail_select(reason) }}
                    {%- endif -%}
                    {%- set type2Dimension = scdType == '2' -%}
                {%- else -%}
                    {%- set type2Dimension = false -%}
                {%- endif -%}
            {%- else -%}
                {%- set type2Dimension = changeTrackingCount > 0 -%}
            {%- endif -%}
        {%- else -%}
            {%- set type2Dimension = false -%}
        {%- endif -%}
        {%- if isSimpleUpsert %}
            {# @upsert always forces plain SCD1, no matter what @lastModifiedTracking/@isChangeTracking say. #}
            {%- set type2Dimension = false -%}
        {%- endif %}

        {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
        {%- set missingSystemColumns = namespace(items=[]) %}

        {# @isSurrogateKey is normally optional (a customer may manage their own, e.g. SEQ.NEXTVAL) — required when @zeroKey needs one to match against, recommended for SCD Type 2. #}
        {%- set hasSurrogateKey = columns | selectattr("isSurrogateKey") | list | length > 0 -%}
        {%- if config.zeroKey is defined and not hasSurrogateKey -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSurrogateKey',
                'example': none,
                'reason': '@zeroKey requires a surrogate key column to match the zero record against; none was found on this node.'
            }] -%}
        {%- elif type2Dimension and not hasSurrogateKey -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': false,
                'annotation': '@isSurrogateKey',
                'example': '0 AS "' ~ node.name ~ '_KEY" @isSurrogateKey',
                'reason': 'Recommended for SCD Type 2, to give tables a stable per-version join key. Ignore this warning if you are managing your own surrogate key logic (e.g. a sequence NEXTVAL) instead of using @isSurrogateKey.'
            }] -%}
        {%- endif -%}

        {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
        {%- if not isSimpleUpsert and not hasSystemCreateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemCreateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate',
                'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
            }] -%}
        {%- endif %}

        {# SYSTEM_UPDATE_DATE is required for both SCD Type 1 and Type 2. #}
        {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
        {%- if not isSimpleUpsert and not hasSystemUpdateDate -%}
            {%- if type2Dimension -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemUpdateDate',
                    'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
                    'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_UPDATE_DATE is carried through from the current target row into CHANGE_DETECTION/MERGE_ROWS so it can be stamped with CURRENT_TIMESTAMP whenever a new or changed version is inserted, marking when that version became active.'
                }] -%}
            {%- else -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemUpdateDate',
                    'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
                    'reason': 'Required for SCD Type 1: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
                }] -%}
            {%- endif -%}
        {%- endif -%}

        {# The remaining system columns are only required for SCD Type 2. #}
        {%- if type2Dimension -%}
            {%- set hasSystemVersion = columns | selectattr("isSystemVersion") | list | length > 0 -%}
            {%- if not hasSystemVersion -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemVersion',
                    'example': '1 AS "SYSTEM_VERSION" @isSystemVersion',
                    'reason': 'Required because this is an SCD Type 2 dimension (a versioned last-modified column, or an @isChangeTracking column, was found): SYSTEM_VERSION is what distinguishes successive versions of the same business key, and it\'s what the outer MERGE\'s ON clause uses (alongside the business key) to target the exact row version being expired or matched.'
                }] -%}
            {%- endif -%}

            {%- set hasSystemCurrentFlag = columns | selectattr("isSystemCurrentFlag") | list | length > 0 -%}
            {%- if not hasSystemCurrentFlag -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemCurrentFlag',
                    'example': '\'Y\' AS "SYSTEM_CURRENT_FLAG" @isSystemCurrentFlag',
                    'reason': 'Required because this is an SCD Type 2 dimension: the CHANGE_DETECTION CTE filters TARGET_CURRENT down to WHERE SYSTEM_CURRENT_FLAG = \'Y\' to find the one active row per business key to compare the incoming source row against — without it there\'s no way to tell which of possibly several historical versions is the current one.'
                }] -%}
            {%- endif -%}

            {%- set hasSystemEndDate = columns | selectattr("isSystemEndDate") | list | length > 0 -%}
            {%- if not hasSystemEndDate -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemEndDate',
                    'example': 'CAST(\'2999-12-31 00:00:00\' AS TIMESTAMP) AS "SYSTEM_END_DATE" @isSystemEndDate',
                    'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_END_DATE is what gets set to the expiry timestamp when a changed row\'s prior version is expired, and to the far-future sentinel on every newly inserted current version — without it there\'s no way to bound how long each historical version was active.'
                }] -%}
            {%- endif -%}
        {%- endif -%}

        {%- if missingSystemColumns.items | length > 0 -%}
            {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
            {# If @isSurrogateKey is the only thing flagged, use a neutral heading since it may just be a custom surrogate key setup. #}
            {%- set onlySurrogateKeyFlagged = missingSystemColumns.items | length == 1 and missingSystemColumns.items[0].annotation == '@isSurrogateKey' and not missingSystemColumns.items[0].required -%}
            {%- set stageName = 'Surrogate Key Not Set/Using Custom Surrogate Key Logic' if onlySurrogateKeyFlagged else 'Missing Required System Columns' %}
            {{ test_stage(stageName, not anyRequired) }}
            {%- for item in missingSystemColumns.items %}
            -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
            {%- if item.example %}
            --    Example: {{ item.example }}
            {%- endif %}
            --    Reason: {{ item.reason }}
            {%- endfor %}
            {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
            {%- if hardFail and anyRequired -%}
                {{ fail_select("Missing required system column(s): " ~ (missingSystemColumns.items | selectattr('required') | map(attribute='annotation') | join(', ')) ~ ". See the comments above for details.") }}
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    Description: Validates a Fact node's annotations (column IDs, mergeStrategy, required system columns). Shared by create.sql.j2 and run.sql.j2.
    Input: hardFail (boolean, default false) — set true from create.sql.j2 so a failed check raises a real SQL error, since CREATE (unlike RUN) doesn't fail on row count alone.
    Output: Rendered test_stage(...) + SELECT statements for every check that fails.
    ===========================================================================#}
    {%- macro validate_fact_requirements(hardFail=false) -%}
        {# CREATE doesn't fail on row count like RUN does, so hardFail forces a real SQL error instead. #}
        {%- macro fail_select(reason) -%}
            {%- if hardFail -%}
                SELECT 1/0
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endmacro -%}

        {# Every Fact column must carry its own @id annotation. #}
        {{ validate_column_ids(hardFail) }}

        {# No @isBusinessKey column is valid for a Fact — it's loaded as a plain insert, so the mergeStrategy/tracking/system-column checks below don't apply. #}
        {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}

        {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}

        {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
        {%- if mergeStrategyExplicit -%}
            {# Matched case-insensitively (must match run.sql.j2). #}
            {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
            {%- set mergeStrategy = mergeStrategyRaw | lower -%}
        {%- else -%}
            {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
            {%- set mergeStrategy = 'changetracking' -%}
        {%- endif -%}
        {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
        {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
        {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' -%}
        {%- set isAllColumnMatch = mergeStrategy == 'allcolumnmatch' %}

        {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
        {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy or isAllColumnMatch) %}
            {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") is not a recognised strategy. Use "changeTracking", "lastModified", "upsert" or "allColumnMatch".' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {# @mergeStrategy always takes priority. An explicit changeTracking/lastModified/upsert merges on the business key, so a missing @isBusinessKey stops the load.
           Not for allColumnMatch, which needs no @isBusinessKey — every column is the match key. An unrecognised value is already flagged above. #}
        {%- if not hasBusinessKey and mergeStrategyExplicit and (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
            {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") merges on the business key, but no column is marked @isBusinessKey. Mark the business key column(s) with @isBusinessKey, or remove @mergeStrategy to load the node as a plain insert.' %}
            {{ test_stage('Invalid configuration: No Business Key', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {# No @mergeStrategy and no business key = plain insert, so @lastModifiedTracking is never read. Warn only — the insert still runs. #}
        {%- if not hasBusinessKey and not mergeStrategyExplicit and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: No Business Key', true) }}
            -- No @mergeStrategy and no column marked @isBusinessKey, so this node is loaded as a plain insert — @lastModifiedTracking will be ignored. Mark the business key column(s) with @isBusinessKey and set @mergeStrategy("lastModified") to use it, or remove the annotation.
            SELECT 1
        {%- endif -%}

        {# allColumnMatch matches on every non-system column, so @isBusinessKey / @lastModifiedTracking are never read. Warn only — the merge still runs. #}
        {%- if isAllColumnMatch and hasBusinessKey %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("allColumnMatch") matches on every non-system column, so @isBusinessKey is ignored — all columns are used as the business key for comparison. Remove @isBusinessKey, or switch mergeStrategy to use it.
            SELECT 1
        {%- endif -%}

        {%- if isAllColumnMatch and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("allColumnMatch") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can't conflict with itself. #}
        {%- if hasBusinessKey and mergeStrategyExplicit and isSimpleUpsert and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("upsert") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {%- if hasBusinessKey and isChangeTrackingStrategy and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
            SELECT 1
        {%- endif -%}

        {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount == 0 %}
            {%- set reason = '@mergeStrategy("lastModified") requires exactly one column marked @lastModifiedTracking; none was found.' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif %}

        {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
        {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount > 1 %}
            {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
            {{ test_stage('Invalid configuration: Last Modified Column', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
        {%- set missingSystemColumns = namespace(items=[]) %}

        {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
        {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemCreateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemCreateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate',
                'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
            }] -%}
        {%- endif %}

        {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
        {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemUpdateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemUpdateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
                'reason': 'Required for SCD Type 1: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
            }] -%}
        {%- endif -%}

        {%- if missingSystemColumns.items | length > 0 -%}
            {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
            {{ test_stage('Missing Required System Columns', not anyRequired) }}
            {%- for item in missingSystemColumns.items %}
            -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
            {%- if item.example %}
            --    Example: {{ item.example }}
            {%- endif %}
            --    Reason: {{ item.reason }}
            {%- endfor %}
            {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
            {%- if hardFail and anyRequired -%}
                {{ fail_select("Missing required system column(s): " ~ (missingSystemColumns.items | selectattr('required') | map(attribute='annotation') | join(', ')) ~ ". See the comments above for details.") }}
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
    The below block of code initializes metadata changes variables for the display
    ===========================================================================#}
    {%- macro update_metadata(tag, diff, label) -%}
        {%- set nsMetaVariables.metadataUpdate = nsMetaVariables.metadataUpdate + '-' + tag -%}

        {# Handle metaDataChanges #}
        {%- if nsMetaVariables.metaDataChanges -%}
            {%- set nsMetaVariables.metaDataChanges = nsMetaVariables.metaDataChanges ~ "\n\n" ~ label ~ " Changes:\n" ~ diff -%}
        {%- else -%}
            {%- set nsMetaVariables.metaDataChanges = label ~ " Changes:\n" ~ diff -%}
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
      Macro : get_clusterby_sql

      Description:
        Generates the CLUSTER BY clause for the node's cluster configuration, from the repeatable
        @clusterKey(<position>, "<expression>") column annotation. Each occurrence contributes one
        term, ordered by <position> (lowest first) — omit the expression to cluster by the column
        itself, or give a transform expression (e.g. trunc(N_NAME, -5)) to cluster by that instead.

      Inputs:
        - col.clusterKey : list of annotation entries per column, each { parameters: [<position>, <expression>] }

      Output:
        - If at least one term is present:
            CLUSTER BY (N_REGIONKEY, trunc(N_NAME, -5))
        - If no valid terms are found:
            '' (empty string)
    ===========================================================================#}
    {%- macro get_clusterby_sql() -%}
        {#- Terms are built once in initializeNodeVariables (nsNodeVariables.desiredClusterKey) #}
        {%- if nsNodeVariables.desiredClusterKey | length > 0 -%}
            CLUSTER BY ({{ nsNodeVariables.desiredClusterKey | join(', ') }})
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : view_definition_sql(state, withTags=true)

      Description:
        Renders a view's definition — everything after CREATE OR REPLACE VIEW <path> — for
        the given state (desiredState or currentState): the column list with column
        comments, the view comment, and the AS <cte> SELECT <transforms> <join> query, plus
        column and view WITH TAG clauses when withTags is true. The object path is left
        out, since renames/moves are handled separately.
        With withTags=false, comparing the current and desired output tells whether
        anything other than tags changed: equal output means only tags (or nothing that
        affects the view's DDL) changed. Both renders use the same template text, so they
        differ only where the states differ.

      Output:
        ("ID", "NAME" WITH TAG (...) COMMENT '...') COMMENT = '...' WITH TAG (...)
        AS <cte> SELECT "SRC"."ID" AS "ID", ... <join>
    ===========================================================================#}
    {%- macro view_definition_sql(state, withTags=true) -%}
        (
            {%- for col in state.columns %}
                "{{ col.name }}"
                {%- if withTags %} {{ tag_with_clause(col.tag) }}{% endif %}
                {%- if col.description | trim | length > 0 %} COMMENT '{{ col.description | escape }}'{% endif %}
                {%- if not loop.last -%}, {%- endif %}
            {%- endfor %}
        )
        {%- if state.node.description | trim | length > 0 %} COMMENT = '{{ state.node.description | escape }}'{% endif %}
        {%- if withTags %} {{ tag_with_clause(state.config.tag) }}{% endif %}
        AS
        {{ state.sources[0].cteString }}
        SELECT {{ state.sources[0].selectModifier | default('', true) }}
        {%- for col in state.sources[0].columns %}
            {{ get_source_transform(col) }} AS "{{ col.name }}"
            {%- if not loop.last -%}, {%- endif %}
        {%- endfor %}
        {{ state.sources[0].join }}
    {%- endmacro -%}


    {#===========================================================================
      Macro : tag_full_name(bareTagName, locationName)

      Description:
        Fully qualifies a bare Snowflake tag name (e.g. "PII") using the database/schema of
        the given storage location, so @tag annotations only need the tag's own name —
        Snowflake requires a fully-qualified tag reference whenever the current session
        database differs from the tag's database. Quoted (via ref_no_link()), so the tag
        name/value must be typed in the exact case the tag was created with in Snowflake.
        Uses ref_no_link() rather than ref() so a tag reference doesn't register a lineage
        dependency edge. locationName defaults to this node's own location — never a
        hardcoded alias — since a location's name can differ across environments.

      Output:
        "DATABASE"."SCHEMA"."tagName"
    ===========================================================================#}
    {%- macro tag_full_name(bareTagName, locationName) -%}
        {{- ref_no_link(locationName | default(node.location.name, true), bareTagName) -}}
    {%- endmacro -%}

    {#===========================================================================
      Macro : tag_duplicates(tagList)

      Description:
        Finds tag names whose (name, location) match another entry in a set of
        @tag(<tagName>, <tagValue>, <location>) annotations — pass config.tag for node-level
        tags, or col.tag for a single column's tags. A given database.schema.tagname is one
        entity regardless of value (Snowflake itself rejects two different values for the
        same tag on one column), so any repeat of the same name+location is a duplicate,
        even with different values. Same name with a different location is allowed.

      Output:
        "COST_CENTER, PII" (comma-separated duplicate names) or '' (empty string) when none.
    ===========================================================================#}
    {%- macro tag_duplicates(tagList) -%}
        {%- set ns = namespace(entries=[], dupes=[]) -%}
        {%- for t in tagList | default([]) -%}
            {%- set entryKey = t.parameters[0] + '|' + (t.parameters[2] | default(node.location.name, true)) -%}
            {%- set ns.entries = ns.entries + [{"key": entryKey, "name": t.parameters[0]}] -%}
        {%- endfor -%}
        {%- for e in ns.entries -%}
            {%- if (ns.entries | selectattr('key', 'equalto', e.key) | list | length) > 1 and e.name not in ns.dupes -%}
                {%- set ns.dupes = ns.dupes + [e.name] -%}
            {%- endif -%}
        {%- endfor -%}
        {{- ns.dupes | join(', ') -}}
    {%- endmacro -%}

    {#===========================================================================
      Macro : tag_check_duplicates()

      Description:
        Validates the node's @tag annotations: the same tag name + location repeated on the
        node, or on any one column, is not allowed (see tag_duplicates). Each offending
        node/column gets a failing test stage that stops the deploy (continue_on_failure
        false), naming the duplicated tags. Call it at the start of the create template,
        before any DDL.

      Output:
        Zero or more "Duplicate Tags Found: <node or column>" test stages, each with a
        SELECT returning the error message, or '' (empty string) when all tags are valid.
    ===========================================================================#}
    {%- macro tag_check_duplicates() -%}
        {%- set nodeDupeTags = tag_duplicates(config.tag) -%}
        {%- if nodeDupeTags | trim | length > 0 %}
            {{ test_stage('Duplicate Tags Found: ' + node.name, false) }}
            SELECT '{{ nodeDupeTags | escape }} is applied multiple times on {{ node.name | escape }}' AS "ERROR_MESSAGE"
        {%- endif %}

        {%- for col in columns -%}
            {%- set colDupeTags = tag_duplicates(col.tag) -%}
            {%- if colDupeTags | trim | length > 0 %}
                {{ test_stage('Duplicate Tags Found: ' + col.name, false) }}
                SELECT '{{ colDupeTags | escape }} is applied multiple times on {{ col.name | escape }}' AS "ERROR_MESSAGE"
            {%- endif %}
        {%- endfor -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : tag_with_clause(tagList)

      Description:
        CREATE / ADD COLUMN: generates the WITH TAG clause for a set of repeatable
        @tag(<tagName>, <tagValue>, <location>) annotations — pass config.tag for the
        node/table-level tags, or col.tag for a single column's tags.

      Output:
        WITH TAG (COST_CENTER = 'FINANCE', PII = 'true')
        or '' (empty string) when tagList has no @tag annotations.
    ===========================================================================#}
    {%- macro tag_with_clause(tagList) -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for t in tagList | default([]) -%}
            {%- set ns.items = ns.items + [tag_full_name(t.parameters[0], t.parameters[2]) + " = '" + (t.parameters[1] | string | escape) + "'"] -%}
        {%- endfor -%}
        {%- if ns.items | length > 0 -%}
            WITH TAG ({{ ns.items | join(', ') }})
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : tag_diff(desiredTagList, currentTagList, mode)

      Description:
        Redeploy: compares a desired and a current set of @tag(<tagName>, <tagValue>,
        <location>) annotations (config.tag or col.tag from desiredState / currentState) and
        returns the comma-separated list for the ALTER statement. Each tag is compared as
        (name, value, location): the value is stringified so 5 and '5' are equal, and a
        missing location falls back to that state's own node location.
          mode == 'set'   -> "tag_name = 'tag_value'" for tags that are new or whose
                              value/location changed (for SET TAG)
          mode == 'unset' -> current tags with no exact (name, value, location) match in
                              the desired set — covers tags removed entirely and tags whose
                              value/location changed, so a changed tag is always unset before
                              being re-set with its new value (for UNSET TAG)

      Output:
        "COST_CENTER = 'FINANCE', PII = 'true'" (mode='set')
        "OLD_TAG, ANOTHER_TAG" (mode='unset')
        or '' (empty string) when nothing needs to change.
    ===========================================================================#}
    {%- macro tag_diff(desiredTagList, currentTagList, mode) -%}
        {%- set ns = namespace(desired=[], current=[], items=[]) -%}
        {%- for t in desiredTagList | default([]) -%}
            {%- set ns.desired = ns.desired + [{"name": t.parameters[0], "value": t.parameters[1] | string, "location": t.parameters[2] | default(node.location.name, true)}] -%}
        {%- endfor -%}
        {%- for t in currentTagList | default([]) -%}
            {%- set ns.current = ns.current + [{"name": t.parameters[0], "value": t.parameters[1] | string, "location": t.parameters[2] | default(currentState.node.location.name, true)}] -%}
        {%- endfor -%}

        {%- if mode == 'set' -%}
            {%- for dt in ns.desired -%}
                {%- set unchanged = ns.current
                                  | selectattr('name', 'equalto', dt.name)
                                  | selectattr('value', 'equalto', dt.value)
                                  | selectattr('location', 'equalto', dt.location)
                                  | list -%}
                {%- if not unchanged -%}
                    {%- set ns.items = ns.items + [tag_full_name(dt.name, dt.location) + " = '" + (dt.value | escape) + "'"] -%}
                {%- endif -%}
            {%- endfor -%}
        {%- else -%}
            {%- for ct in ns.current -%}
                {%- set exactMatch = ns.desired
                                  | selectattr('name', 'equalto', ct.name)
                                  | selectattr('value', 'equalto', ct.value)
                                  | selectattr('location', 'equalto', ct.location)
                                  | list -%}
                {%- if not exactMatch -%}
                    {%- set ns.items = ns.items + [tag_full_name(ct.name, ct.location)] -%}
                {%- endif -%}
            {%- endfor -%}
        {%- endif -%}
        {{- ns.items | join(', ') -}}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_tag_sql()

      Description:
        Redeploy stages that bring an existing object's @tag annotations from currentState to
        desiredState — column-level tags first (columns matched by id, then by name), then
        node-level tags. A changed tag is unset before it is re-set. The ALTER keyword (VIEW or
        TABLE) and the stage-name label come from desiredState. Sets
        nsNodeVariables.metaDataChanged when any stage is emitted.

      Output:
        Zero or more "Unset Tags: <column>" / "Set Tags: <column>" / "Unset <View|Table> Tags" /
        "Set <View|Table> Tags" stages with their ALTER statements.
    ===========================================================================#}
    {%- macro alter_tag_sql() -%}
        {%- set objectPath = nsNodeVariables.desObjectNameFullPath -%}
        {%- set objectKind = 'VIEW' if node.materializationType == 'view' else 'TABLE' -%}

        {#- Column-level tags #}
        {%- for curCol in currentState.columns -%}
            {%- set matchingCols = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
            {%- if not matchingCols -%}
                {%- set matchingCols = columns | default([]) | selectattr('name', 'equalto', curCol.name) | list -%}
            {%- endif -%}

            {%- if matchingCols -%}
                {%- set desCol = matchingCols | first -%}
                {%- set setColTagClause = tag_diff(desCol.tag, curCol.tag, 'set') -%}
                {%- set unsetColTagClause = tag_diff(desCol.tag, curCol.tag, 'unset') -%}

                {#- Unset before set #}
                {%- if unsetColTagClause | trim | length > 0 %}
                    {{ stage('Unset Tags: ' + desCol.name) }}
                    ALTER {{ objectKind }} {{ objectPath }}
                    MODIFY COLUMN "{{ desCol.name }}" UNSET TAG {{ unsetColTagClause }}
                    {%- set nsNodeVariables.metaDataChanged = true -%}
                {%- endif %}

                {%- if setColTagClause | trim | length > 0 %}
                    {{ stage('Set Tags: ' + desCol.name) }}
                    ALTER {{ objectKind }} {{ objectPath }}
                    MODIFY COLUMN "{{ desCol.name }}" SET TAG {{ setColTagClause }}
                    {%- set nsNodeVariables.metaDataChanged = true -%}
                {%- endif %}
            {%- endif -%}
        {%- endfor -%}

        {#- Node-level tags #}
        {%- set setTagClause = tag_diff(config.tag, currentState.config.tag, 'set') -%}
        {%- set unsetTagClause = tag_diff(config.tag, currentState.config.tag, 'unset') -%}

        {#- Unset before set #}
        {%- if unsetTagClause | trim | length > 0 %}
            {{ stage('Unset ' + objectKind | title + ' Tags') }}
            ALTER {{ objectKind }} {{ objectPath }}
            UNSET TAG {{ unsetTagClause }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}

        {%- if setTagClause | trim | length > 0 %}
            {{ stage('Set ' + objectKind | title + ' Tags') }}
            ALTER {{ objectKind }} {{ objectPath }}
            SET TAG {{ setTagClause }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_metadata_sql()

      Description:
        Redeploy fallback for tables and views: when the node changed (currentState !=
        desiredState) but no redeploy stage changed the object (nsNodeVariables.
        metaDataChanged is still false) — e.g. only tests, writeMode or pre/post SQL
        changed — emits a no-op stage so the deploy still records the new state. Call it
        last, after every alter_ macro of the redeploy path.

      Output:
        "Metadata Update-Default" stage with select 1=0, or ''
        (empty string) when something was already altered or nothing changed.
    ===========================================================================#}
    {%- macro alter_metadata_sql() -%}
        {%- if currentState != desiredState and not nsNodeVariables.metaDataChanged %}
            {{ stage('Metadata Update-Default') }}
            select 1=0
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : object_drop_sql()

      Description:
        Drops the current object when it can't be altered into the desired one:
          - the node was deleted (no desiredState)          -> "(node deleted)"
          - the materialization changed, e.g. view -> table -> "(replaced by <type>)"
          - a view was renamed or moved                     -> "(renamed/moved to <path>)"
        A table that is only renamed or moved is not dropped — alter_rename_sql() renames
        it in place, keeping its data. The DROP keyword comes from dropMaterialization().
        Call it before the create (or as the whole delete path). Sets
        nsNodeVariables.metaDataChanged when the stage is emitted.

      Output:
        "Drop <type>" stage with its DROP ... IF EXISTS, or ''
        (empty string) when the current object can stay.
    ===========================================================================#}
    {%- macro object_drop_sql() -%}
        {%- if currentState is defined and currentState -%}
            {%- set currentMatType = currentState.node.materializationType -%}
            {%- set reason = '' -%}
            {%- if desiredState is not defined or not desiredState -%}
                {%- set reason = 'node deleted' -%}
            {%- elif currentMatType != node.materializationType -%}
                {%- set reason = 'replaced by ' + node.materializationType -%}
            {%- elif node.materializationType == 'view'
                    and nsNodeVariables.curObjectNameFullPath != nsNodeVariables.desObjectNameFullPath -%}
                {%- set reason = 'renamed/moved to ' + nsNodeVariables.desObjectNameFullPath -%}
            {%- endif -%}

            {%- if reason | length > 0 %}
                {{ stage('Drop ' + currentMatType) }}
                DROP {{ dropMaterialization(currentMatType) }} {{ nsNodeVariables.curObjectNameFullPath }}
                {%- set nsNodeVariables.metaDataChanged = true -%}
            {%- endif %}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_rename_sql()

      Description:
        Redeploy stage that renames and/or moves the existing object when its name or
        storage location changed (current vs desired full path). The ALTER keyword (VIEW or
        TABLE) and the stage-name label come from the current object's materialization.
        Call it only when the materialization is unchanged — a type change is a drop and
        create instead. Sets nsNodeVariables.metaDataChanged when the stage is emitted.

      Output:
        "Rename / Move <type>" stage with its ALTER ... RENAME TO,
        or '' (empty string) when the path is unchanged.
    ===========================================================================#}
    {%- macro alter_rename_sql() -%}
        {%- if nsNodeVariables.curObjectNameFullPath != nsNodeVariables.desObjectNameFullPath %}
            {%- set currentMatType = currentState.node.materializationType -%}
            {%- set objectKind = 'VIEW' if currentMatType == 'view' else 'TABLE' %}
            {{ stage('Rename / Move ' + currentMatType) }}
            ALTER {{ objectKind }} IF EXISTS {{ nsNodeVariables.curObjectNameFullPath }}
            RENAME TO {{ nsNodeVariables.desObjectNameFullPath }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_description_sql()

      Description:
        Redeploy stage that updates the existing object's comment when the node
        description changed. A missing description counts as empty, so undefined vs ''
        is not a change. The ALTER keyword (VIEW or TABLE) and the stage-name label come
        from the desired materialization; the ALTER targets the desired path, so call it
        after alter_rename_sql(). Sets nsNodeVariables.metaDataChanged when the stage is
        emitted.

      Output:
        "Change <type> description" stage with its ALTER ... SET COMMENT,
        or '' (empty string) when the description is unchanged.
    ===========================================================================#}
    {%- macro alter_description_sql() -%}
        {%- set desiredDescription = node.description | default('', true) -%}
        {%- if (currentState.node.description | default('', true)) != desiredDescription %}
            {%- set objectKind = 'VIEW' if node.materializationType == 'view' else 'TABLE' %}
            {{ stage('Change ' + node.materializationType + ' description') }}
            ALTER {{ objectKind }} {{ nsNodeVariables.desObjectNameFullPath }}
            SET COMMENT = '{{ desiredDescription | escape }}'
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_drop_columns_sql()

      Description:
        Redeploy stage that drops the table columns no longer in the node, in a single
        ALTER TABLE ... DROP COLUMN. The columns come from nsNodeVariables.droppedColumns
        (current columns with no desired match by id or by name, so a renamed column is
        not dropped). Tables only — views are recreated instead. Sets
        nsNodeVariables.metaDataChanged when the stage is emitted.

      Output:
        "Drop Columns" stage with its ALTER TABLE ... DROP COLUMN,
        or '' (empty string) when no column is dropped.
    ===========================================================================#}
    {%- macro alter_drop_columns_sql() -%}
        {%- if nsNodeVariables.droppedColumns | length > 0 %}
            {{ stage('Drop Columns') }}
            ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
            DROP COLUMN {{ nsNodeVariables.droppedColumns | join(', ') }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_add_columns_sql()

      Description:
        Redeploy stage that adds the node's new columns to the existing table, in a single
        ALTER TABLE ... ADD COLUMN. A desired column is new when no current column matches
        it by id or by name (so a renamed column is not re-added). Each column carries its
        data type, NOT NULL (when nullable == false), DEFAULT, WITH TAG and COMMENT, as on
        CREATE. Tables only — views are recreated instead. Sets
        nsNodeVariables.metaDataChanged when the stage is emitted.

      Output:
        "Add Columns" stage with its ALTER TABLE ... ADD COLUMN,
        or '' (empty string) when no column is added.
    ===========================================================================#}
    {%- macro alter_add_columns_sql() -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for desCol in columns -%}
            {%- set idAlreadyCurrent = currentState.columns | default([]) | selectattr('id', 'equalto', desCol.id) | list -%}
            {%- set nameAlreadyCurrent = desCol.name in (currentState.columns | default([]) | map(attribute='name') | list) -%}
            {%- if not idAlreadyCurrent and not nameAlreadyCurrent -%}
                {%- set ns.items = ns.items + [desCol] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if ns.items | length > 0 %}
            {{ stage('Add Columns') }}
            ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
            ADD COLUMN
            {%- for desCol in ns.items %}
                "{{ desCol.name }}" {{ desCol.dataType }}
                {%- if desCol.nullable == false %} NOT NULL {%- endif %}
                {%- if desCol.defaultValue | length > 0 %} DEFAULT {{ desCol.defaultValue }} {%- endif %}
                {{ tag_with_clause(desCol.tag) }}
                {%- if desCol.description | trim | length > 0 %} COMMENT '{{ desCol.description | escape }}'{%- endif %}
                {%- if not loop.last -%}, {%- endif %}
            {%- endfor %}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_rename_columns_sql()

      Description:
        Redeploy stages that rename table columns in place, keeping their data. A column is
        renamed when a desired column has the same id as a current column but a different
        name — matching is by id only, so it relies on stable column ids:
          - Dimension / Fact: columns carry @id, so a rename is a true RENAME COLUMN.
          - Work (SQL): if a column's id changes along with its name, it is not a rename —
            the old column is dropped (alter_drop_columns_sql) and the new one added
            (alter_add_columns_sql), so its existing data is lost.
        One ALTER per column (Snowflake renames one column per statement). Tables only —
        views are recreated instead. Sets nsNodeVariables.metaDataChanged when any stage is
        emitted.

      Output:
        One "Rename Column <old name>" stage per renamed column with its
        ALTER TABLE ... RENAME COLUMN, or '' (empty string) when no column is renamed.
    ===========================================================================#}
    {%- macro alter_rename_columns_sql() -%}
        {%- for curCol in currentState.columns -%}
            {%- set idMatches = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
            {%- if idMatches and (idMatches | first).name != curCol.name %}
                {%- set newName = (idMatches | first).name %}
                {{ stage('Rename Column ' + curCol.name) }}
                ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
                RENAME COLUMN "{{ curCol.name }}" TO "{{ newName }}"
                {%- set nsNodeVariables.metaDataChanged = true -%}
            {%- endif %}
        {%- endfor -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_modify_columns_sql()

      Description:
        Redeploy stages that change attributes of existing table columns in place. Current
        columns are matched to desired ones by id, then by name; for each match, any change
        to these attributes is collected:
          - data type   (case- and whitespace-insensitive: varchar(10) = VARCHAR(10))
          - nullability (nullable == false means NOT NULL)
          - description (missing = '')
          - default     (missing = none)
        One "Change Column Attributes: <column>" stage per changed column, with one ALTER TABLE ... MODIFY
        covering all its changes. Call it after alter_rename_columns_sql(), so it uses the new column names.
        Snowflake limits: SET DATA TYPE only widens VARCHAR/NUMBER precision, and SET DEFAULT
        only accepts sequence defaults — other changes fail at deploy. Tables only. Sets
        nsNodeVariables.metaDataChanged when any stage is emitted.

      Output:
        One "Change Column Attributes: <column>" stage per changed column with its
        ALTER TABLE ... MODIFY, or '' (empty string) when no column attribute changed.
    ===========================================================================#}
    {%- macro alter_modify_columns_sql() -%}
        {%- for curCol in currentState.columns -%}
            {%- set matchingCols = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
            {%- if not matchingCols -%}
                {%- set matchingCols = columns | default([]) | selectattr('name', 'equalto', curCol.name) | list -%}
            {%- endif -%}

            {%- if matchingCols -%}
                {%- set desCol = matchingCols | first -%}
                {%- set currentNotNull = curCol.nullable == false -%}
                {%- set currentDefaultValue = curCol.defaultValue if curCol.defaultValue else none -%}
                {%- set currentDescription = curCol.description if curCol.description else '' -%}
                {%- set desiredNotNull = desCol.nullable == false -%}
                {%- set desiredDefaultValue = desCol.defaultValue if desCol.defaultValue else none -%}
                {%- set desiredDescription = desCol.description if desCol.description else '' -%}

                {#- Collect a MODIFY action per changed attribute #}
                {%- set ns = namespace(actions=[]) -%}
                {%- if (curCol.dataType | upper | replace(' ', '')) != (desCol.dataType | upper | replace(' ', '')) -%}
                    {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" SET DATA TYPE ' ~ desCol.dataType] -%}
                {%- endif -%}
                {%- if currentNotNull != desiredNotNull -%}
                    {%- if desiredNotNull -%}
                        {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" SET NOT NULL'] -%}
                    {%- else -%}
                        {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" DROP NOT NULL'] -%}
                    {%- endif -%}
                {%- endif -%}
                {%- if currentDescription != desiredDescription -%}
                    {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" COMMENT ' ~ "'" ~ (desiredDescription | escape) ~ "'"] -%}
                {%- endif -%}
                {%- if currentDefaultValue != desiredDefaultValue -%}
                    {%- if desiredDefaultValue == none -%}
                        {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" DROP DEFAULT'] -%}
                    {%- else -%}
                        {%- set ns.actions = ns.actions + ['COLUMN "' + desCol.name + '" SET DEFAULT ' ~ desiredDefaultValue] -%}
                    {%- endif -%}
                {%- endif -%}

                {%- if ns.actions | length > 0 %}
                    {{ stage('Change Column Attributes: ' + desCol.name) }}
                    ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
                    MODIFY {{ ns.actions | join(', ') }}
                    {%- set nsNodeVariables.metaDataChanged = true -%}
                {%- endif %}
            {%- endif -%}
        {%- endfor -%}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_drop_cluster_key_sql()

      Description:
        Redeploy stage that drops the table's clustering key before columns are dropped or
        renamed — call it just before alter_drop_columns_sql(). Snowflake rejects dropping
        or renaming a column that belongs to the clustering key (error 003320), so the key
        is dropped first when:
          - a column carrying @clusterKey is being dropped or renamed, or
          - the key is changing in the same deploy that drops columns (another column's
            expression may reference a dropped column, e.g. trunc("B", -5) on "A").
        The new key, if any, is applied later by alter_cluster_key_sql(). Sets
        nsNodeVariables.clusterKeyDropped and nsNodeVariables.metaDataChanged when the
        stage is emitted. Tables only.

      Output:
        "Drop Cluster Key" stage with its ALTER TABLE ...
        DROP CLUSTERING KEY, or '' (empty string) when the key can stay.
    ===========================================================================#}
    {%- macro alter_drop_cluster_key_sql() -%}
        {%- set ns = namespace(clusteredDropped=[], clusteredRenamed=[]) -%}
        {%- for colName in nsNodeVariables.currentClusterKeyColumns -%}
            {%- if colName in nsNodeVariables.droppedColumns -%}
                {%- set ns.clusteredDropped = ns.clusteredDropped + [colName] -%}
            {%- elif colName in nsNodeVariables.renamedColumns -%}
                {%- set ns.clusteredRenamed = ns.clusteredRenamed + [colName] -%}
            {%- endif -%}
        {%- endfor -%}
        {#- Whitespace-insensitive, so trunc(a,-5) vs trunc(a, -5) is not a change #}
        {%- set keyChanged = (nsNodeVariables.desiredClusterKey | map('replace', ' ', '') | list)
                          != (nsNodeVariables.currentClusterKey | map('replace', ' ', '') | list) -%}

        {#- Clustered columns being dropped and/or renamed force the key to be dropped first #}
        {%- set nsReason = namespace(parts=[]) -%}
        {%- if ns.clusteredDropped | length > 0 -%}
            {%- set nsReason.parts = nsReason.parts + ['before dropping clustered columns: ' + (ns.clusteredDropped | join(', '))] -%}
        {%- endif -%}
        {%- if ns.clusteredRenamed | length > 0 -%}
            {%- set nsReason.parts = nsReason.parts + ['before renaming clustered columns: ' + (ns.clusteredRenamed | join(', '))] -%}
        {%- endif -%}

        {%- if nsReason.parts | length > 0
                or (keyChanged and nsNodeVariables.droppedColumns | length > 0 and nsNodeVariables.currentClusterKey | length > 0) %}
            {%- if nsReason.parts | length > 0 %}
                {{ stage('Drop Cluster Key') }}
            {%- else %}
                {{ stage('Drop Cluster Key') }}
            {%- endif %}
            ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
            DROP CLUSTERING KEY
            {%- set nsNodeVariables.clusterKeyDropped = true -%}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      Macro : alter_cluster_key_sql()

      Description:
        Redeploy stage that brings the table's clustering key to the desired @clusterKey
        terms — call it after alter_add_columns_sql() and alter_rename_columns_sql(), so
        the new key can reference added or renamed columns. Comparison ignores whitespace;
        position renumbering that keeps the same order is not a change.
          - desired key set, and changed or dropped early -> CLUSTER BY (<terms>)
          - no desired key, current key exists, not already dropped -> DROP CLUSTERING KEY
        Sets nsNodeVariables.metaDataChanged when a stage is emitted. Tables only.

      Output:
        "Recluster Table" or "Drop Cluster Key"
        stage with its ALTER TABLE, or '' (empty string) when unchanged.
    ===========================================================================#}
    {%- macro alter_cluster_key_sql() -%}
        {%- set keyChanged = (nsNodeVariables.desiredClusterKey | map('replace', ' ', '') | list)
                          != (nsNodeVariables.currentClusterKey | map('replace', ' ', '') | list) -%}

        {%- if nsNodeVariables.desiredClusterKey | length > 0 and (keyChanged or nsNodeVariables.clusterKeyDropped) %}
            {{ stage('Recluster Table') }}
            ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
            CLUSTER BY ({{ nsNodeVariables.desiredClusterKey | join(', ') }})
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- elif nsNodeVariables.desiredClusterKey | length == 0 and nsNodeVariables.currentClusterKey | length > 0
                and not nsNodeVariables.clusterKeyDropped %}
            {{ stage('Drop Cluster Key') }}
            ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
            DROP CLUSTERING KEY
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
    Purpose: Determines the correct Snowflake DROP object syntax based on the materialization type.
     
    Input: materialization (string): The Snowflake object type to be dropped
      (e.g., table, view, materialized view, dynamic table, external table).
     
    Returns: string: The appropriate DROP object keyword with IF EXISTS
      (e.g., 'table IF EXISTS', 'view IF EXISTS', 'materialized view IF EXISTS').
    ===========================================================================#}
    {% macro dropMaterialization(materialization) %}
        {%- if materialization | lower in ['table', 'transient table','temporary table', 'hybrid table'] -%}
            TABLE IF EXISTS
        {%- elif materialization | lower in ['view', 'secure view', 'run view', 'cortex search service'] -%}
            VIEW IF EXISTS
        {%- elif materialization | lower in ['dynamic table','transient dynamic table', 'dynamic iceberg table'] -%}
            DYNAMIC TABLE IF EXISTS
        {%- elif materialization | lower == 'materialized view' -%}
            MATERIALIZED VIEW IF EXISTS
        {%- elif materialization | lower == 'external table' -%}
            EXTERNAL TABLE IF EXISTS
        {%- elif materialization | lower == 'iceberg table' -%}
            ICEBERG TABLE IF EXISTS
        {%- elif materialization | lower == 'interactive table' -%}
            INTERACTIVE TABLE IF EXISTS
        {%- elif materialization | lower == 'stream' -%}
            STREAM IF EXISTS
        {%- else -%}
            TABLE IF EXISTS
        {%- endif %}
    {% endmacro %}
name: macro
type: Macro
